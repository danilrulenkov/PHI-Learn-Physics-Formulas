  <script>
    /* Тема оформления: «dark» или «light». Пока человек не выбрал вручную, берётся тема системы и следует за ней.
       Выбор хранится в том же хранилище, что и прогресс (ui.theme). Тема ставится до первой отрисовки, поэтому мигания нет. */
    (function () {
      var R = document.documentElement, mq = null, cur = null;
      try { mq = matchMedia('(prefers-color-scheme: light)'); } catch (e) { /* без системной темы */ }
      function saved() { try { var u = (JSON.parse(localStorage.getItem('mechcore.v1')) || {}).ui; return u && (u.theme === 'light' || u.theme === 'dark') ? u.theme : null; } catch (e) { return null; } }
      function sys() { return mq && mq.matches ? 'light' : 'dark'; }
      function apply(t) {
        if (t === cur) return; cur = t;
        R.setAttribute('data-theme', t); R.style.colorScheme = t; R.classList.toggle('dark', t === 'dark');
        var a = document.querySelector('meta[name="color-scheme"]'); if (a) a.setAttribute('content', t);
        var b = document.querySelector('meta[name="theme-color"]'); if (b) b.setAttribute('content', t === 'light' ? '#F4F5F7' : '#0F1420');
        try { document.dispatchEvent(new CustomEvent('fx:theme', { detail: { theme: t } })); } catch (e) { /* не страшно */ }
      }
      window.fxTheme = { get: function () { return cur; }, apply: apply };
      apply(saved() || sys());
      /* Размер шрифта: три шага на <html> (15 / 17 / 19 px), ставится до первой отрисовки */
      try { var fz = (JSON.parse(localStorage.getItem('mechcore.v1')) || {}).ui; R.style.fontSize = ({ 1: '17px', 2: '19px' })[fz && fz.fs] || ''; } catch (e) { /* не страшно */ }
      var follow = function () { if (!saved()) apply(sys()); };
      if (mq) { if (mq.addEventListener) mq.addEventListener('change', follow); else if (mq.addListener) mq.addListener(follow); }
    })();
  </script>
  <style id="fx-config">
    /* ═══════════════ НАСТРОЙКИ ЭФФЕКТОВ ═══════════════
       Всё, что регулирует вид фона, света и стекла, лежит здесь.
       Цвета: «R,G,B». Яркость: 0 — нет, 1 — максимум. */
    :root{
      /* Фон: один источник цвета сверху — мягкий радиальный свет, без движения.
         --fx-src — цвет и яркость (последнее число в rgba — сила света, 0–1), --fx-src-h — на какую высоту экрана он опускается,
         --fx-bg-dur — за сколько секунд фон плавно перетекает в новый цвет при смене темы. Для светлой темы значение ниже. */
      --fx-src:rgba(34,98,255,.66);  --fx-src-h:78vh;  --fx-bg-dur:.6s;
      /* Стекло: карточки, поиск, строки. Заливка полупрозрачная (фон просвечивает), без размытия */
      --fx-glass:linear-gradient(135deg,rgba(72,76,216,.40) 0%,rgba(40,64,182,.35) 55%,rgba(26,62,164,.38) 100%);  /* карточки */
      --fx-glass-strong:linear-gradient(135deg,rgba(46,62,174,.92) 0%,rgba(34,58,154,.91) 55%,rgba(30,56,146,.92) 100%);  /* верхняя карточка Блица (под ней стопка карт) */
      --fx-glass2:rgba(52,80,196,.30);      /* заливка строки поиска, кнопок и строк-аккордеонов */
      --fx-glass-line:rgba(104,208,248,.22);  /* тихая рамка в цвет акцента (голубой с бирюзой) */
      --fx-line-hi:rgba(104,208,248,.45);     /* та же рамка при наведении */
      /* Текст блока «Условия»: светлый сине-голубой, тише формулы */
      --fx-cond:#9fc8f0;  --fx-cond-hi:#c8e2fb;
      /* Блик на кнопке «Старт»: длительность блика = период × 13% */
      --fx-shine-period:6s;  --fx-shine-alpha:.5;
      /* Часть 2. Края при свайпе в Блице: цвет «R,G,B», яркость 0–1, ширина свечения */
      --fx-edge-ok:92,203,139;  --fx-edge-bad:229,87,91;  --fx-edge-alpha:.5;  --fx-edge-w:46vw;
      /* Часть 2. Стопка карт под верхней: цвет и плотность заливки */
      --fx-stack-rgb:5,10,48;  --fx-stack-alpha:.82;
      /* Часть 2. Таймер Блица: точка на конце полоски, покраснение в последние секунды */
      --fx-dot-rgb:150,210,255;  --fx-low-rgb:255,138,142;
      /* Часть 2. Кнопка «Выучено»: плавность перекраски */
      --fx-learn-dur:.35s;
    }
    /* Светлая тема: источник — едва заметный голубоватый тон на почти белом (0.15 — сила, поднимите для заметнее) */
    html[data-theme="light"]{ --fx-src:rgba(70,110,255,.15); }
  </style>
  <script>
    /* Время в миллисекундах. startDelay — пауза после заставки, после которой справочник начинает заранее дорисовывать формулы. */
    window.FX_CFG = { startDelay: 150,
       /* Часть 2 (мс, доли, пиксели). pressScale — во сколько сжимается нажатая кнопка, pressOut — возврат пружиной.
          riseStep — задержка между карточками, riseMax — сколько карточек появляется по очереди, risePx — подъём.
          fwdDur — выход следующей карточки в Блице, edgeFull — на сколько пикселей отклонения край светит на максимум,
          warnSec — сколько секунд до конца таймер краснеет. vib — виброимпульсы (мс). */
       pressScale: .97, pressIn: 80, pressOut: 200, spring: 'cubic-bezier(.34,1.56,.64,1)',
       riseDur: 340, riseStep: 40, riseMax: 8, risePx: 10, learnDur: 350, rollDur: 260,
       fwdDur: 300, edgeFull: 120, warnSec: 10,
       vib: { ok: 12, bad: [40, 50, 40], end: 260, learn: 14 } };
    /* Пока НЕ используется: цвет источника не привязан к теме и разделу (это ещё не утверждено).
       Оставлено на будущее. Число — оттенок на цветовом круге в градусах: 0 красный, 60 жёлтый, 120 зелёный, 180 голубой,
       240 синий, 300 малиновый. Строки идут в том же порядке, что и темы в списке, поэтому при прокрутке цвет
       движется по спектру. У каждого раздела свой участок круга: механика — от зелёно-бирюзового к индиго,
       МКТ и термодинамика — от фиолетового через малиновый и красный к оранжевому (тепло ближе к концу).
       Новый раздел: добавьте строку с его id и темами; шаг между соседними темами 16–24°. */
    window.FX_HUES = {
      mechanics: { kinematics: 160, dynamics: 184, conservation: 208, statics_hydro: 232, oscillations: 256 },
      mkt: { mkt: 262, gas: 278, vapor: 294, liquid: 310, solid: 326, thermo_energy: 342, thermo_proc: 358, thermo_heat: 14, thermo_engine: 30 }
    };
  </script>

  <style>
    :root { color-scheme: dark; }

    /* Длинные формулы прокручиваются внутри блока, а не ломают страницу */
    .katex-display { overflow-x: auto; overflow-y: hidden; padding: 0.25rem 0; }

    ::selection { background: rgba(34, 211, 238, 0.3); }
    summary { list-style: none; }
    summary::-webkit-details-marker { display: none; }
    .chev { transition: transform .15s; }
    details[open] > summary .chev { transform: rotate(180deg); }

    /* Батарея блица: 3 ячейки = 3 жизни. Остаток 3 — зелёный, 2 — жёлтый, 1 — красный */
    .bat { display: inline-flex; align-items: center; --mid: #5ccb8b; --lo: #5ccb8b; }
    .bat[data-level="2"] { --mid: #e3b04b; --lo: #e3b04b; }
    .bat[data-level="1"] { --mid: #e5575b; --lo: #e5575b; }
    .bat-body { display: flex; gap: 3px; padding: 3px; border: 2px solid #38448f; border-radius: 4px; background: #01072c; transition: border-color .2s; }
    .bat-cap { width: 4px; height: 10px; margin-left: 1px; background: #38448f; border-radius: 0 2px 2px 0; transition: background-color .2s; }
    .bat[data-level="0"] .bat-body { border-color: #e5575b; }
    .bat[data-level="0"] .bat-cap { background: #e5575b; }
    .bat-cell { width: 20px; height: 16px; background: var(--bat-cell, #0b1448); }
    .bat-cell i { display: block; width: 100%; height: 100%; opacity: 0; transform: scaleX(.4); transition: opacity .25s, transform .25s;
      background: var(--mid); }
    .bat-cell.on i { opacity: 1; transform: none; }
    .bat[data-level="1"] .bat-cell.on i { animation: bat-low 1.2s ease-in-out infinite; }
    .bat-hit { animation: bat-hit .4s; }
    @keyframes bat-low { 50% { opacity: .5; } }
    @keyframes bat-hit { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-3px); } 40% { transform: translateX(3px); } 60% { transform: translateX(-2px); } 80% { transform: translateX(2px); } }
    @media (prefers-reduced-motion: reduce) { .bat-hit, .bat[data-level="1"] .bat-cell.on i { animation: none; } .bat-cell i { transition: none; } }

  <style id="theme">:root{--bg:#010626;--sf:#0d174f;--ln:#172266;--tx:#e8ecff;--mu:#8089c4;--rd:#e5575b;--bl:#2b74ea;--gn:#5ccb8b;--mg:#e0343a;--sf2:#16216a}
body{background:var(--bg)!important;background-image:none!important;color:var(--tx)}
::selection{background:rgba(79,140,255,.35)}
.font-mono{font-family:inherit}
.bg-zinc-950{background:var(--bg)}
.bg-slate-900,.bg-slate-900\/40,.bg-slate-900\/50,.bg-slate-900\/60,.bg-slate-900\/70{background:var(--sf)}
.text-slate-100,.text-slate-200{color:var(--tx)}
.text-slate-300{color:#c6cdf3}
.text-slate-400,.text-slate-500{color:var(--mu)}
.text-sky-400{color:var(--mu)}
.wrap{max-width:72rem;margin:0 auto;padding:0 1rem}
.hd{position:sticky;top:0;z-index:40;background:rgba(1,7,44,.92)}
.hd-row{display:flex;align-items:center;justify-content:flex-end}
.mg{height:.74em;width:.62em;margin:0 .06em;overflow:visible}
.mg path{fill:none;stroke-width:8}
.mg-g{stroke:#d4d4d0}
.prog{display:flex;align-items:center;gap:.9rem;font-size:.85rem;color:var(--mu)}
.prog .bar{flex:1;height:2px;background:var(--ln)}
.prog i{display:block;height:2px;width:0;background:var(--gn);transition:width .3s}
article{background:transparent;border:0;border-bottom:1px solid var(--ln);border-radius:0;padding:1.4rem 0}
#tr-root .rounded-2xl.border,#bl-root .rounded-2xl.border{border-color:transparent;background:var(--sf)}
.fbox{padding:1.1rem 0}
.fbox .katex{font-size:1.4em}
.sec{color:var(--mu);font-size:.9rem}

<style id="fx-theme">

<style id="redesign">
/* ═══════════════ РЕДИЗАЙН: Палитра «Графит + мята» ═══════════════
   1. Мягкая акцентная заливка (12–15%) для выбранных вкладок и тем + спокойные сегментированные переключатели.
   2. Цвет раздела (--acc-s) только в мелочах: полоска прогресса, точка у темы и подчёркивание.
   3. Тёмная тема: графит #0F1420, карточки #1D2128, приглушённый белый #E6E9F0.
   4. Светлая тема: #F4F5F7, карточки #FFFFFF, акцент #0F9D76.
   5. Прогресс и «Выучено» — зелёный/мятный, ошибки — коралловый, синего и чистого чёрного нет. */
@property --section-hue{syntax:'<number>';inherits:true;initial-value:220}
:root{--section-hue:220;transition:--section-hue var(--hue-dur,250ms) ease}

  --sf-pill:#2B313D;
  --ln:#2B313D;
  --t1:#E6E9F0;
  --tx:#CFD5E0;
  --mu:#8A93A6;
  --unsel:#9BA4B5;
  --acc:#4FD1A5;
  --acc-soft:rgba(79,209,165,.14);
  --acc-soft-hi:rgba(79,209,165,.20);
  --acc-border:rgba(79,209,165,.30);
  --on-acc:#0D1F18;
  --bl:#4FD1A5;
  --gn:#4FD1A5;
  --rd:#F06E6B;
  --mg:#F06E6B;
  --ok-bg:rgba(79,209,165,.14);
  --ok-border:rgba(79,209,165,.36);
  --bad-bg:rgba(240,110,107,.14);
  --bad-border:rgba(240,110,107,.38);
  --fx-glass:#1D2128;
  --fx-glass-strong:#1D2128;
  --fx-glass2:#252A34;
  --fx-glass-line:#2B313D;
  --fx-line-hi:rgba(230,233,240,.26);
  --fx-cond:#949EB0;
  --fx-cond-hi:#CFD5E0;
  --fx-stack-rgb:29,33,40;
  --fx-stack-alpha:.95;
  --fx-dot-rgb:79,209,165;
  --fx-low-rgb:240,110,107;
  --fx-edge-ok:79,209,165;
  --fx-edge-bad:240,110,107;
  --bat-cell:#252A34;
  --acc-s:hsl(var(--section-hue) 56% 58%)}

html:root[data-theme="light"]{
  --bg:#F4F5F7;
  --sf:#FFFFFF;
  --sf2:#EAECEF;
  --sf-pill:#FFFFFF;
  --ln:#DFE3EA;
  --t1:#1B2028;
  --tx:#2C3340;
  --mu:#687182;
  --unsel:#555E6E;
  --acc:#0F9D76;
  --acc-soft:rgba(15,157,118,.13);
  --acc-soft-hi:rgba(15,157,118,.19);
  --acc-border:rgba(15,157,118,.28);
  --on-acc:#FFFFFF;
  --bl:#0F9D76;
  --gn:#0F9D76;
  --rd:#D94E4E;
  --mg:#D94E4E;
  --ok-bg:rgba(15,157,118,.12);
  --ok-border:rgba(15,157,118,.34);
  --bad-bg:rgba(217,78,78,.11);
  --bad-border:rgba(217,78,78,.36);
  --fx-glass:#FFFFFF;
  --fx-glass-strong:#FFFFFF;
  --fx-glass2:#EAECEF;
  --fx-glass-line:#DFE3EA;

  --fx-low-rgb:217,78,78;
  --fx-edge-ok:15,157,118;

  --card-shadow:0 1px 3px rgba(20,23,28,.04),0 6px 18px -6px rgba(20,23,28,.06);

/* ── 2. Нейтральный фон без цветного свечения ── */

html:root[data-theme] .hb-sec,

html:root[data-theme] .fcb.on,
html:root[data-theme] .fsb.on,
html:root[data-theme] .sec-pill.on,
html:root[data-theme] .sec-item.on,

<style id="fit-fix">

html:root[data-theme] #hb-list article button[data-act="learn"]{min-height:3.4rem;border-radius:16px}

/* 6. Лента разделов: размытие остаётся (иначе текст карточек просвечивает при прокрутке),
   но оно без saturate и растворяется к краям — ступеньки цвета между ореолом и строкой «Выучено» нет */
@media (max-width:1099.98px){
  html:root[data-theme] .hb-stick::before{
    content:"";position:absolute;z-index:-1;left:-1rem;right:-1rem;top:-.5rem;bottom:-1.7rem;pointer-events:none;
    -webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 26%,#000 76%,transparent 100%);
    mask-image:linear-gradient(180deg,transparent 0,#000 26%,#000 76%,transparent 100%)}
}
</style>

<style id="type-harmony">
/* ═══ Шрифты тренажёра и блица по шкале справочника ═══
   Справочник: метка 0.8rem/600 · заголовок 1.2rem/650 · кнопки и пункты 0.92–0.95rem · пояснения 0.9rem */

/* Верхняя строка («← Назад», «Серия», «Счёт», время) */
html:root[data-theme] #tr-root div.text-xs,
html:root[data-theme] #bl-root div.text-xs{font-size:.9rem;font-weight:600}
html:root[data-theme] #bl-root div.text-sm{font-size:1rem;font-weight:650}

/* Карточка задания: метка темы и название — как в карточке справочника */
html:root[data-theme] #tr-root p.text-xs,
html:root[data-theme] #bl-root p.text-xs,
html:root[data-theme] #tr-root span.text-xs,
html:root[data-theme] #bl-root span.text-xs{font-size:.8rem;font-weight:600;letter-spacing:0}
html:root[data-theme] #tr-root .rounded-2xl.border h3,
html:root[data-theme] #bl-root #bl-card h3{margin-top:.5rem;font-size:1.2rem;line-height:1.25;font-weight:650}

/* Описания и подписи над настройками */
html:root[data-theme] #tr-root .sec,
html:root[data-theme] #bl-root .sec{font-size:.9rem;line-height:1.55;font-weight:400}
html:root[data-theme] .bl-cfg-label,
html:root[data-theme] .rec-l{font-size:.8rem;font-weight:600;letter-spacing:0;text-transform:none}

/* Кнопки списка тем, «Повторить ошибки», «Старт», «В меню» */
html:root[data-theme] #tr-root button.rounded-xl.text-sm,
html:root[data-theme] #bl-root button.rounded-xl.text-sm{font-size:.95rem;font-weight:600}
html:root[data-theme] #tr-root button.text-sm.font-semibold,
html:root[data-theme] #bl-root button.text-sm.font-semibold{font-weight:700}
html:root[data-theme] .bl-err-btn{font-size:.9rem;font-weight:600}
html:root[data-theme] .seg button{font-size:.92rem;font-weight:600}

/* Конструктор */
html:root[data-theme] .ct-mode-btn{font-size:.8rem;font-weight:650}
html:root[data-theme] .ct-hint,
html:root[data-theme] .ct-nm{font-size:.85rem}
html:root[data-theme] .ct-act2 button{font-size:.9rem;font-weight:650}
html:root[data-theme] .ct-ghost{font-size:.9rem;font-weight:600}

/* Блиц: подсказки и бейджи */
html:root[data-theme] .bl-swipe-hint{font-size:.8rem}
html:root[data-theme] .bl-badge{font-size:.8rem;font-weight:700;letter-spacing:.02em}

/* Результаты: «Верно!», пояснения, итог раунда */
html:root[data-theme] #tr-result p.font-semibold{font-size:1rem;font-weight:650}
html:root[data-theme] #tr-result p.text-xs{font-size:.9rem;font-weight:400;line-height:1.55}
html:root[data-theme] #bl-root h3.text-sm{font-size:1rem;font-weight:650}
html:root[data-theme] #bl-root p.text-sm{font-size:.95rem;font-weight:600}
</style>
<style id="theme-morph">
/* Переключатель темы: одна кнопка, иконка плавно превращается из солнца в полумесяц и обратно */
html:root[data-theme] button.thsw{display:grid;place-items:center;flex:none;width:2.6rem;height:2.6rem;padding:0;border:0;border-radius:999px;
  background:var(--sf2);box-shadow:inset 0 0 0 1px var(--ln);color:var(--t1);cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:background-color .6s ease,box-shadow .6s ease;view-transition-name:theme-btn}
html:root[data-theme="light"] button.thsw{background:#fff}
.thsw svg{width:1.45rem;height:1.45rem;overflow:visible;transform:translateX(0) rotate(0deg);transition:transform .7s cubic-bezier(.5,0,.2,1)}
.thm-core{r:4.4px;transition:r .6s cubic-bezier(.5,0,.2,1)}
.thm-cut{cx:31px;cy:1px;r:7px;transition:cx .6s cubic-bezier(.5,0,.2,1),cy .6s cubic-bezier(.5,0,.2,1)}
.thm-rays{transform-origin:12px 12px;transition:transform .6s cubic-bezier(.5,0,.2,1),opacity .35s ease}
html[data-theme="dark"] .thsw svg{transform:translateX(.14rem) rotate(45deg)}
html[data-theme="dark"] .thm-core{r:8.4px}
html[data-theme="dark"] .thm-cut{cx:17.5px;cy:6.5px}
html[data-theme="dark"] .thm-rays{transform:rotate(70deg) scale(.35);opacity:0}
@media (prefers-reduced-motion:reduce){.thsw svg,.thm-core,.thm-cut,.thm-rays,button.thsw{transition:none!important}}

/* Смена темы: вся страница перетекает за ~0.6 с; сама кнопка не растворяется, а превращается на месте */
::view-transition-old(root),::view-transition-new(root){animation-duration:.6s;animation-timing-function:cubic-bezier(.4,0,.2,1)}
::view-transition-group(theme-btn){animation:none}
::view-transition-old(theme-btn){display:none}
::view-transition-new(theme-btn){animation:none}
/* запасной путь без View Transitions */
html.theme-fade *:not(.thsw):not(.thsw *){transition:background-color .6s ease,color .6s ease,border-color .6s ease,box-shadow .6s ease,fill .6s ease,stroke .6s ease!important}
</style>
<style id="hd-settings">
/* Шапка: шестерёнка слева, название раздела по центру, тема справа.
   Кнопки по краям одного размера, поэтому название стоит ровно по центру и шапка не прыгает */
.hd-row{justify-content:space-between;gap:.6rem}
html:root[data-theme] button.hdb{display:grid;place-items:center;flex:none;width:2.6rem;height:2.6rem;padding:0;border:0;border-radius:999px;
  background:var(--sf2);box-shadow:inset 0 0 0 1px var(--ln);color:var(--t1);cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:background-color .6s ease,box-shadow .6s ease,opacity .2s ease}
html:root[data-theme="light"] button.hdb{background:#fff}
.hdb svg{width:1.4rem;height:1.4rem;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .45s cubic-bezier(.5,0,.2,1)}
.hdb:active svg{transform:rotate(30deg)}
html.bl-run .hdb{opacity:.35;pointer-events:none}
.hd-title{flex:1;min-width:0;text-align:center;font-size:1.05rem;font-weight:700;letter-spacing:.01em;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  pointer-events:none;opacity:0;transform:translateY(3px);transition:opacity .22s ease,transform .22s ease}
.hd-title.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.hd-title,.hdb svg{transition:none}}
/* Панель настроек (та же нижняя шторка, что и у фильтра по темам) */
.scard{max-height:78dvh;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(1rem + env(safe-area-inset-bottom,0px))}
.srow{padding:.75rem 0}
.srow+.srow{border-top:1px solid var(--ln)}
.slab{display:block;margin-bottom:.55rem;font-size:.82rem;font-weight:600;color:var(--mu)}
.sz0{font-size:.82rem}.sz1{font-size:1.02rem}.sz2{font-size:1.26rem}
.sdanger,.sghost{padding:.75rem 1rem;border-radius:14px;font-size:.95rem;font-weight:700;box-shadow:inset 0 0 0 1px var(--ln)}
.sdanger{width:100%;background:var(--sf2);color:var(--rd)}
.sghost{background:transparent;color:var(--tx)}
.sconf-t{margin:0 0 .7rem;font-size:.88rem;line-height:1.4;color:var(--mu)}
.sconf-b{display:flex;gap:.5rem}
.sconf-b>*{flex:1}
</style>
<style id="flat-float">
/* 1. Ровный фон: цветной ореол сверху убран. Цвет раздела остаётся только акцентом (--acc: активная вкладка, выделения) */
html:root[data-theme] #aurora{display:none}

/* Счётчик «выучено»: число выученных — цветом текста и крупнее (акцент); зелёной остаётся только полоска прогресса */
html:root[data-theme] #hb-progress .rn{font-size:2.1rem;color:var(--t1)}

/* 4. Нижняя панель: плавающая капсула, оторванная от краёв экрана (телефон и планшет; на ПК вкладки в левой колонке) */
@media (max-width:1099.98px){
  html:root[data-theme] .bnav{
    left:0;right:0;margin:0 auto;
    bottom:calc(10px + env(safe-area-inset-bottom,0px));
    width:calc(100% - 28px);max-width:26rem;
    padding:.3rem;gap:.2rem;
    border:1px solid var(--ln);border-radius:999px;
    background:var(--sf);
    box-shadow:0 12px 28px -10px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.2)}
  html:root[data-theme="light"] .bnav{box-shadow:0 12px 28px -10px rgba(20,32,90,.28),0 2px 6px rgba(20,32,90,.10)}
  html:root[data-theme] nav.bnav button.tb,
  html:root[data-theme] nav.bnav button.tb.tab-on{height:3.2rem;border-radius:999px}
  html:root[data-theme] body:not(.no-nav) main.mx-auto{padding-bottom:calc(6.4rem + env(safe-area-inset-bottom,0px))}
  /* Активная вкладка: мягкая заливка и подпись в цвете раздела (--acc-s), без обводки */
  html:root[data-theme] nav.bnav button.tb.tab-on{
    background:color-mix(in srgb,var(--acc-s) 16%,transparent);
    color:color-mix(in srgb,var(--acc-s) 80%,var(--t1));
    box-shadow:none}
}
</style>

<body class="flex min-h-[100dvh] flex-col bg-zinc-950 font-sans text-slate-200 antialiased">
  <div id="bg" aria-hidden="true"><i id="bg-src"></i><div id="aurora"></div></div>

  <div id="splash" aria-hidden="true">
    <i class="sp-bg a"></i><i class="sp-bg b"></i>
    <div class="sp-stage" id="sp-stage">
      <svg class="sp-svg sp-glow" id="sp-glow" viewBox="-20 -8 504 312"><g fill="#9DB4E0"><g id="sg-L0"><path id="sg-phi" d=""/></g><g id="sg-L1"><path id="sg-h1" d=""/><path id="sg-h2" d=""/><path id="sg-h3" d=""/></g><g id="sg-L2"><path id="sg-i1" d=""/></g></g></svg>
      <svg class="sp-svg sp-glow sp-glow-tag" id="sp-glow-tag" viewBox="-20 -8 504 312"><g id="sg-tag" fill="#9DB4E0"></g></svg>
      <svg class="sp-svg" viewBox="-20 -8 504 312">
        <g id="sp-mark" fill="#E6E9F0" transform="translate(93,-18) scale(1.16)">
          <g id="sp-L0"><path id="sp-phi" d=""/></g>
          <g id="sp-L1"><path id="sp-h1" d=""/><path id="sp-h2" d=""/><path id="sp-h3" d=""/></g>

  <script>
  (function () {
    var sp = document.getElementById('splash');
    if (!sp) return;
    var done = false;
    function finish() {
      if (done) return;
      done = true;
      document.documentElement.classList.remove('sp-on');
      sp.classList.add('sp-out');
      setTimeout(function () { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 450);
    }
    try {
      if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { sp.parentNode.removeChild(sp); return; }
      document.documentElement.classList.add('sp-on');
      sp.addEventListener('click', finish);
      setTimeout(finish, 9000);

      function ss(a, b, x) {
        var t = Math.max(0, Math.min(1, (x - a) / (b - a)));
        return t * t * (3 - 2 * t);
      }
      // Скорость живой руки: медленный старт, быстрая середина, мягкая остановка
      function handEase(u) {
        if (u <= 0) return 0;
        if (u >= 1) return 1;
        // Уверенный старт, быстрая середина, мягкая остановка (без откатов назад)
        var x = Math.pow(u, 0.8);
        return x * x * (3 - 2 * x);
      }
      function evalBez(seg, t) {
        var u = 1 - t, u2 = u * u, t2 = t * t;
        var b0 = u2 * u, b1 = 3 * u2 * t, b2 = 3 * u * t2, b3 = t2 * t;
        var x = b0 * seg[0][0] + b1 * seg[1][0] + b2 * seg[2][0] + b3 * seg[3][0];
        var y = b0 * seg[0][1] + b1 * seg[1][1] + b2 * seg[2][1] + b3 * seg[3][1];
        var vx = 3 * u2 * (seg[1][0] - seg[0][0]) + 6 * u * t * (seg[2][0] - seg[1][0]) + 3 * t2 * (seg[3][0] - seg[2][0]);
        var vy = 3 * u2 * (seg[1][1] - seg[0][1]) + 6 * u * t * (seg[2][1] - seg[1][1]) + 3 * t2 * (seg[3][1] - seg[2][1]);
        return [x, y, vx, vy];
      }
      // Плавная анимация 60 кадров/с на всех устройствах: предвычисление геометрии штрихов и кэширование состояния DOM
      var TIP_SEGS = 8, TIP_COS = [], TIP_SIN = [];
      for (var ti = 1; ti < TIP_SEGS; ti++) {
        var ta = (ti / TIP_SEGS) * Math.PI;
        TIP_COS.push(Math.cos(ta));
        TIP_SIN.push(Math.sin(ta));
      }
      function buildSpline(segs, N, radFn) {
        var raw = [], arc = [0], i, s, p, dx, dy, steps = 120;
        for (s = 0; s < segs.length; s++) {
          for (i = 0; i < steps || (s === segs.length - 1 && i === steps); i++) {
            p = evalBez(segs[s], i / steps);
            if (raw.length) {
              dx = p[0] - raw[raw.length - 1][0];
              dy = p[1] - raw[raw.length - 1][1];
              arc.push(arc[arc.length - 1] + Math.hypot(dx, dy));
            }
            raw.push(p);
          }
        }
        var tot = arc[arc.length - 1], pts = [], idx = 0;
        for (i = 0; i < N; i++) {
          var u = i / (N - 1), target = u * tot;
          while (idx < arc.length - 2 && arc[idx + 1] < target) idx++;
          var span = arc[idx + 1] - arc[idx] || 1;
          var f = (target - arc[idx]) / span;
          var a = raw[idx], b = raw[idx + 1];
          var x = a[0] + (b[0] - a[0]) * f, y = a[1] + (b[1] - a[1]) * f;
          var vx = a[2] + (b[2] - a[2]) * f, vy = a[3] + (b[3] - a[3]) * f;
          var len = Math.hypot(vx, vy) || 1;
          var tx = vx / len, ty = vy / len, nx = -ty, ny = tx, r = radFn(u);
          pts.push({
            x: x, y: y, tx: tx, ty: ty, nx: nx, ny: ny, r: r,
            lp: (x + nx * r).toFixed(1) + ',' + (y + ny * r).toFixed(1),
            rp: (x - nx * r).toFixed(1) + ',' + (y - ny * r).toFixed(1)
          });
        }
        var ps = pts[0], tail = [];
        for (i = 0; i < TIP_COS.length; i++) {
          var c = TIP_COS[i], sn = TIP_SIN[i];
          tail.push((ps.x + ps.r * (-c * ps.nx - sn * ps.tx)).toFixed(1) + ',' + (ps.y + ps.r * (-c * ps.ny - sn * ps.ty)).toFixed(1));
        }
        pts.tailStr = tail.join('L');
        return pts;
      }
      function ribbonD(pts, prog) {
        if (prog <= 0.003) return '';
        var n = pts.length, mf = Math.min(1, prog) * (n - 1);
        var k = Math.floor(mf), fr = mf - k;
        if (k >= n - 1) { k = n - 1; fr = 0; }
        var out = [], i, p;
        for (i = 0; i <= k; i++) out.push(pts[i].lp);
        var pe = pts[k], hasFr = fr > 1e-3 && k < n - 1;
        if (hasFr) {
          var A = pts[k], B = pts[k + 1];
          var tx = A.tx + (B.tx - A.tx) * fr, ty = A.ty + (B.ty - A.ty) * fr;
          var l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
          var nx = -ty, ny = tx, rx = A.r + (B.r - A.r) * fr;
          var px = A.x + (B.x - A.x) * fr, py = A.y + (B.y - A.y) * fr;
          pe = {
            x: px, y: py, tx: tx, ty: ty, nx: nx, ny: ny, r: rx,
            lp: (px + nx * rx).toFixed(1) + ',' + (py + ny * rx).toFixed(1),
            rp: (px - nx * rx).toFixed(1) + ',' + (py - ny * rx).toFixed(1)
          };
          out.push(pe.lp);
        }
        for (i = 0; i < TIP_COS.length; i++) {
          var c = TIP_COS[i], s = TIP_SIN[i];
          out.push((pe.x + pe.r * (c * pe.nx + s * pe.tx)).toFixed(1) + ',' + (pe.y + pe.r * (c * pe.ny + s * pe.ty)).toFixed(1));
        }
        if (hasFr) out.push(pe.rp);
        for (i = k; i >= 0; i--) out.push(pts[i].rp);
        if (pts.tailStr) out.push(pts.tailStr);
        return 'M' + out.join('L') + 'Z';
      }

      var phiSegs = [
        [[42, 19], [25, 44], [17, 72], [17, 102]],
        [[17, 102], [17, 150], [36, 185], [70, 185]],
        [[70, 185], [128, 185], [223, 114], [223, 55]],
        [[223, 55], [223, 4], [144, -2], [118, 78]],
        [[118, 78], [102, 127.2], [80, 215], [61.5, 290]]
      ];
      var phiPts = buildSpline(phiSegs, 140, function (s) {
        var wBowl = ss(0, 0.11, s) * (1 - ss(0.14, 0.28, s));
        var wStem = ss(0.58, 0.72, s) * (1 - 0.30 * ss(0.90, 1.0, s));
        return 5.0 + 5.6 * Math.min(1, wBowl + wStem) + 1.6 * (1 - ss(0, 0.08, s));
      });

      function mkLine(p0, p1, p2, p3, r0, rm, r1) {
        return buildSpline([[p0, p1, p2, p3]], 28, function (s) {
          return (1 - s) * r0 + s * r1 + (rm - 0.5 * (r0 + r1)) * Math.sin(Math.PI * s);
        });
      }
      // H и I в том же «пере», что и φ: общий наклон ~11°, стойки толще, перекладина тоньше, I — одна палка без засечек
      // Порядок письма H: левая ножка -> перекладина слева направо (одним движением) -> правая ножка сверху -> I.
      // Каждый штрих начинается ровно там, где закончился предыдущий (t0 следующего = t1 предыдущего).
      var hiStrokes = [
        { el: document.getElementById('sp-h1'), pts: mkLine([282, 22], [270, 82], [259, 142], [247, 202], 7.4, 10.8, 7.2), t0: 1270, t1: 1570, lastP: -1 },
        { el: document.getElementById('sp-h2'), pts: mkLine([376, 22], [364, 82], [353, 142], [341, 202], 7.4, 10.8, 7.2), t0: 1870, t1: 2170, lastP: -1 },
        { el: document.getElementById('sp-h3'), pts: mkLine([262, 119], [296, 114], [330, 108], [362, 105], 3.6, 5.0, 3.4), t0: 1570, t1: 1870, lastP: -1 },
        { el: document.getElementById('sp-i1'), pts: mkLine([446, 22], [434, 82], [423, 142], [411, 202], 7.4, 10.8, 7.2), t0: 2210, t1: 2520, lastP: -1 }
      ];

      var elPhi = document.getElementById('sp-phi'), lastPhiP = -1, lastShiftP = -1;
      var elMark = document.getElementById('sp-mark');
      var glow = document.getElementById('sp-glow'), glowReady = false, sweepDone = false, gw = 0, G0 = 2560, G1 = 4060, BX0 = -126, BX1 = 590, SWELL = 0.12, SWELL_R = 115, letters = [];
      // G0..G1 — когда идёт блик (мс); SWELL — на сколько буква вырастает (0.12 = на 12%); SWELL_R — как широко свет «подхватывает» букву
      var glowTag = document.getElementById('sp-glow-tag'), elTag = document.getElementById('sp-tag'), sgTag = document.getElementById('sg-tag'), tag = [];

      // Обновление букв подписи «Learn Physics Formulas» от положения центра блика bx (только при реальном изменении атрибутов)
      function tagFrame(bx, sweeping) {
        try {
          for (var j = 0; j < tag.length; j++) {
            var T = tag[j];
            var a = sweeping ? ss(T.cx - 42, T.cx - 14.7, bx) : 0;
            var dd = Math.abs(bx - T.cx);
            var k = (sweeping && dd < 42) ? 0.5 * (1 + Math.cos(Math.PI * dd / 42)) : 0;
            var tf = k > 0.0005 ? 'translate(' + T.cxStr + ' 280) scale(' + (1 + 0.30 * k).toFixed(4) + ') translate(' + T.ncxStr + ' -280)' : '';
            if (tf !== T.tf) {
              T.tf = tf;
              if (tf) {
                T.a.setAttribute('transform', tf);
                T.b.setAttribute('transform', tf);
              } else {
                T.a.removeAttribute('transform');
                T.b.removeAttribute('transform');
              }
            }
            var op = a <= 0 ? '0' : (a >= 1 ? '1' : a.toFixed(4));
            if (op !== T.op) {
              T.op = op;
              T.a.setAttribute('opacity', op);
              T.b.setAttribute('opacity', op);
            }
            var r = Math.round(142 + 88 * k), gr = Math.round(152 + 81 * k), bl = Math.round(168 + 72 * k);
            var fl = 'rgb(' + r + ',' + gr + ',' + bl + ')';
            if (fl !== T.fl) {
              T.fl = fl;
              T.a.setAttribute('fill', fl);
            }
          }
        } catch (e) {
          if (elTag) elTag.innerHTML = '';
          if (sgTag) sgTag.innerHTML = '';
          tag = [];
        }
      }

      var t0 = performance.now(), fontsOk = !(document.fonts && document.fonts.ready), started = false;
      if (!fontsOk) {
        var fontWait = document.fonts.ready;
        try {
          if (document.fonts.load) {
            fontWait = Promise.all([fontWait, document.fonts.load('500 23px Inter', 'Learn Physics Formulas')]);
          }
        } catch (e) {}
        fontWait.then(function () { fontsOk = true; }, function () { fontsOk = true; });
      }
      function start() {
        if (started || done) return;
        started = true;
        // Измерение строки временным <text> через getExtentOfChar и создание 20 букв подписи
        try {
          if (elTag && sgTag) {
            var ns = 'http://www.w3.org/2000/svg', str = 'Learn Physics Formulas';
            var tmp = document.createElementNS(ns, 'text');
            tmp.setAttribute('x', '104');
            tmp.setAttribute('y', '288');
            tmp.textContent = str;
            elTag.appendChild(tmp);
            for (var ci = 0; ci < str.length; ci++) {
              var ch = str.charAt(ci);
              if (ch === ' ') continue;
              var ext = tmp.getExtentOfChar(ci);
              var xi = ext.x, cx = ext.x + (ext.width - 2.07) / 2;
              var ta = document.createElementNS(ns, 'text');
              ta.setAttribute('x', xi.toFixed(2));
              ta.setAttribute('y', '288');
              ta.setAttribute('fill', 'rgb(142,152,168)');
              ta.setAttribute('opacity', '0');
              ta.textContent = ch;
              elTag.appendChild(ta);
              var tb = document.createElementNS(ns, 'text');
              tb.setAttribute('x', xi.toFixed(2));
              tb.setAttribute('y', '288');
              tb.setAttribute('opacity', '0');
              tb.textContent = ch;
              sgTag.appendChild(tb);
              tag.push({ a: ta, b: tb, cx: cx, cxStr: cx.toFixed(1), ncxStr: (-cx).toFixed(1), tf: '', op: '0', fl: 'rgb(142,152,168)' });
            }
            elTag.removeChild(tmp);
          }
        } catch (e) {
          if (elTag) elTag.innerHTML = '';
          if (sgTag) sgTag.innerHTML = '';
          tag = [];
        }
        var f0 = null, T_PHI = 1100, T_SHIFT0 = 1000, T_SHIFT1 = 1560, T_TOTAL = 4410;
        function frame(ts) {
          if (done) return;
          if (f0 === null) f0 = ts;
          var t = (ts - f0) * 1.47; // скорость ×1.47: раскадровка на 4410 мс проходит за ~3 с в честных 60 fps
          // 1. Рисование прописной буквы φ по центру (0 .. 1100 мс)
          var pPhi = handEase(Math.min(1, t / T_PHI));
          if (pPhi !== lastPhiP) {
            lastPhiP = pPhi;
            elPhi.setAttribute('d', ribbonD(phiPts, pPhi));
          }

          // 2. Плавный сдвиг φ влево (1000 .. 1560 мс)
          var sProg = ss(T_SHIFT0, T_SHIFT1, t);
          if (sProg !== lastShiftP) {
            lastShiftP = sProg;
            var tx = 93 * (1 - sProg);
            var ty = -18 * (1 - sProg);
            var sc = 1.16 - 0.16 * sProg;
            elMark.setAttribute('transform', 'translate(' + tx.toFixed(2) + ',' + ty.toFixed(2) + ') scale(' + sc.toFixed(4) + ')');
          }

          // 3. Дорисовка H (ножка, перекладина, вторая ножка) и I по очереди (1270 .. 2520 мс)
          for (var i = 0; i < hiStrokes.length; i++) {
            var st = hiStrokes[i];
            if (t >= st.t0 && st.lastP < 1) {
              var spg = handEase(Math.min(1, (t - st.t0) / (st.t1 - st.t0)));
              if (spg !== st.lastP) {
                st.lastP = spg;
                st.el.setAttribute('d', ribbonD(st.pts, spg));
              }
            }
          }

          // 4. Блик идёт слева направо; буква, над которой он сейчас, плавно вырастает,
          //    а когда свет уходит дальше, возвращается, и растёт следующая
          if (t >= G0 && !sweepDone) {
            if (!glowReady) {
              glowReady = true;
              ['phi', 'h1', 'h2', 'h3', 'i1'].forEach(function (k) {
                document.getElementById('sg-' + k).setAttribute('d', document.getElementById('sp-' + k).getAttribute('d') || '');
              });
              gw = glow.getBoundingClientRect().width || 300;
              [[120, 144], [318, 112], [428, 112]].forEach(function (fb, n) {
                var a = document.getElementById('sp-L' + n), cx = fb[0], cy = fb[1];
                try { var bb = a.getBBox(); cx = bb.x + bb.width / 2; cy = bb.y + bb.height / 2; } catch (e) {}
                letters.push({ a: a, b: document.getElementById('sg-L' + n), cx: cx, cy: cy, cxStr: cx.toFixed(1) + ' ' + cy.toFixed(1), ncxStr: (-cx).toFixed(1) + ' ' + (-cy).toFixed(1), tf: '' });
              });
            }
            var g = Math.max(0, Math.min(1, (t - G0) / (G1 - G0)));
            // почти ровный ход света, чтобы на буквах он не рывками ускорялся и тормозил
            var ge = 0.7 * g + 0.3 * ss(0, 1, g);
            var bx = BX0 + (BX1 - BX0) * ge; // центр полосы света в координатах рисунка
            var pos = ((bx + 20) / 504 * gw - 0.21 * gw).toFixed(1) + 'px 0';
            glow.style.webkitMaskPosition = pos; glow.style.maskPosition = pos;
            glow.style.opacity = g >= 1 ? '0' : '1';
            try {
              if (glowTag) {
                glowTag.style.webkitMaskPosition = pos; glowTag.style.maskPosition = pos;
                glowTag.style.opacity = g >= 1 ? '0' : '1';
              }
              if (g >= 1) {
                for (var tj = 0; tj < tag.length; tj++) {
                  var T = tag[tj];
                  if (T.tf) { T.tf = ''; T.a.removeAttribute('transform'); T.b.removeAttribute('transform'); }
                  if (T.op !== '1') { T.op = '1'; T.a.setAttribute('opacity', '1'); T.b.setAttribute('opacity', '1'); }
                  if (T.fl !== 'rgb(169,200,236)') { T.fl = 'rgb(169,200,236)'; T.a.setAttribute('fill', 'rgb(169,200,236)'); }
                }
              } else {
                tagFrame(bx, true);
              }
            } catch (e) {
              if (elTag) elTag.innerHTML = '';
              if (sgTag) sgTag.innerHTML = '';
              if (glowTag) glowTag.style.opacity = '0';
              tag = [];
            }
            for (var li = 0; li < letters.length; li++) {
              var L = letters[li], dd = Math.abs(bx - L.cx);
              var k = (g >= 1 || dd >= SWELL_R) ? 0 : 0.5 * (1 + Math.cos(Math.PI * dd / SWELL_R));
              var ltf = k > 0.0005 ? 'translate(' + L.cxStr + ') scale(' + (1 + SWELL * k).toFixed(4) + ') translate(' + L.ncxStr + ')' : '';
              if (ltf !== L.tf) {
                L.tf = ltf;
                if (ltf) {
                  L.a.setAttribute('transform', ltf); L.b.setAttribute('transform', ltf);
                } else {
                  L.a.removeAttribute('transform'); L.b.removeAttribute('transform');
                }
              }
            }
            if (g >= 1) sweepDone = true;
          }
          if (t < T_TOTAL) {
            requestAnimationFrame(frame);
          } else {
            finish();
          }
        }
        requestAnimationFrame(frame);
      }
      function poll() {
        if (started || done) return;
        var waited = performance.now() - t0;
        if ((window.MC_READY && fontsOk && waited >= 120) || waited >= 1500) start(); else requestAnimationFrame(poll);
      }
      requestAnimationFrame(poll);
    } catch (err) { finish(); }
  })();
  </script>

      {"id":"osc_energy_any","category":"oscillations","subCategory":"Энергия колебаний","title":"Закон сохранения энергии при колебаниях (в любой точке)","latex":"\\frac{m\\,v^2}{2} + \\frac{k\\,x^2}{2} = \\frac{k\\,A^2}{2}","variables":[{"symbol":"m","name":"Масса груза","unit":"кг"},{"symbol":"v","name":"Скорость груза","unit":"м/с"},{"symbol":"k","name":"Жёсткость пружины","unit":"Н/м"},{"symbol":"x","name":"Координата груза","unit":"м"},{"symbol":"A","name":"Амплитуда колебаний","unit":"м"}],"conditions":"Трения нет. Кинетическая E_k = mv²/2 и потенциальная E_p = kx²/2 переходят друг в друга, сумма постоянна. Энергия меняется с частотой 2ν, вдвое чаще, чем координата.","derivation":{"kind":"derivation","steps":[["Исходное","трения нет, полная энергия сохраняется: $E = E_k + E_p = \\text{const}$"],["Подстановка","в крайней точке $x = A$, $v = 0$, поэтому $E = \\dfrac{kA^2}{2}$; в произвольной точке $E = \\dfrac{mv^2}{2} + \\dfrac{kx^2}{2}$"],["Итог","$\\dfrac{mv^2}{2} + \\dfrac{kx^2}{2} = \\dfrac{kA^2}{2}$"]]}},
      {"id":"osc_damped_amp","category":"oscillations","subCategory":"Затухающие и вынужденные колебания","title":"Амплитуда затухающих колебаний","latex":"A(t) = A_0\\,e^{-\\beta t}","variables":[{"symbol":"A(t)","name":"Амплитуда в момент времени t","unit":"м"},{"symbol":"A_0","name":"Начальная амплитуда","unit":"м"},{"symbol":"\\beta","name":"Коэффициент затухания","unit":"с⁻¹"},{"symbol":"t","name":"Время","unit":"с"}],"conditions":"Слабое затухание (β ≪ ω₀), сила сопротивления пропорциональна скорости: F = −rv, β = r/(2m). Амплитуда убывает по экспоненте; за время 1/β она уменьшается в e ≈ 2,7 раза.","derivation":{"kind":"derivation","steps":[["Исходное","$m\\ddot{x} = -kx - r\\dot{x}$, то есть $\\ddot{x} + 2\\beta\\dot{x} + \\omega_0^2 x = 0$, где $\\beta = \\dfrac{r}{2m}$"],["Подстановка","при $\\beta < \\omega_0$ решение имеет вид $x = A_0 e^{-\\beta t}\\cos(\\omega t + \\varphi_0)$"],["Итог","множитель перед косинусом — амплитуда: $A(t) = A_0 e^{-\\beta t}$"]]}},
      {"id":"osc_damped_omega","category":"oscillations","subCategory":"Затухающие и вынужденные колебания","title":"Частота затухающих колебаний","latex":"\\omega = \\sqrt{\\omega_0^2 - \\beta^2}","variables":[{"symbol":"\\omega","name":"Циклическая частота затухающих колебаний","unit":"рад/с"},{"symbol":"\\omega_0","name":"Собственная циклическая частота","unit":"рад/с"},{"symbol":"\\beta","name":"Коэффициент затухания","unit":"с⁻¹"}],"conditions":"Затухание уменьшает частоту: ω < ω₀. При β ≥ ω₀ колебаний нет, движение апериодическое. При слабом затухании ω ≈ ω₀.","derivation":{"kind":"derivation","steps":[["Исходное","подставляем $x = e^{-\\beta t}\\cos\\omega t$ в $\\ddot{x} + 2\\beta\\dot{x} + \\omega_0^2 x = 0$"],["Подстановка","уравнение выполняется при $\\omega^2 = \\omega_0^2 - \\beta^2$"],["Итог","$\\omega = \\sqrt{\\omega_0^2 - \\beta^2}$"]]}},
      {"id":"osc_resonance","category":"oscillations","subCategory":"Затухающие и вынужденные колебания","title":"Условие резонанса","latex":"\\omega = \\omega_0","variables":[{"symbol":"\\omega","name":"Частота вынуждающей силы","unit":"рад/с"},{"symbol":"\\omega_0","name":"Собственная частота системы","unit":"рад/с"}],"conditions":"Вынужденные колебания при малом затухании. Амплитуда резко растёт, когда частота внешнего воздействия совпадает с собственной. Чем меньше затухание, тем выше и уже пик. Резонанс вреден (мосты, детали машин) и полезен (радиоприёмник, качели).","derivation":{"kind":"derivation","steps":[["Исходное","вынуждающая сила $F\\cos\\omega t$ подталкивает систему; её работа за период наибольшая, если толчки совпадают по фазе со скоростью"],["Условие","это выполняется при совпадении периодов: $T = T_0$"],["Итог","$\\omega = \\omega_0$"]]}},
      {"id":"wave_speed","category":"waves","subCategory":"Механические волны","title":"Скорость волны, длина волны и частота","latex":"v = \\lambda\\,\\nu = \\frac{\\lambda}{T}","variables":[{"symbol":"v","name":"Скорость распространения волны","unit":"м/с"},{"symbol":"\\lambda","name":"Длина волны","unit":"м"},{"symbol":"\\nu","name":"Частота","unit":"Гц"},{"symbol":"T","name":"Период","unit":"с"}],"conditions":"Длина волны — расстояние, на которое волна распространяется за один период (расстояние между ближайшими точками, колеблющимися в одной фазе). При переходе в другую среду частота не меняется, меняются v и λ.","derivation":{"kind":"derivation","steps":[["Исходное","за период $T$ волна проходит расстояние, равное длине волны $\\lambda$, с постоянной скоростью"],["Подстановка","$v = \\dfrac{\\lambda}{T}$, а $\\dfrac{1}{T} = \\nu$"],["Итог","$v = \\lambda\\nu = \\dfrac{\\lambda}{T}$"]]}},
      {"id":"wave_equation","category":"waves","subCategory":"Механические волны","title":"Уравнение бегущей волны","latex":"\\xi(x,t) = A\\cos(\\omega\\,t - k\\,x + \\varphi_0)","variables":[{"symbol":"\\xi","name":"Смещение точки среды от положения равновесия","unit":"м"},{"symbol":"A","name":"Амплитуда волны","unit":"м"},{"symbol":"\\omega","name":"Циклическая частота","unit":"рад/с"},{"symbol":"k","name":"Волновое число (k = 2π/λ = ω/v)","unit":"рад/м"},{"symbol":"x","name":"Координата точки вдоль луча","unit":"м"},{"symbol":"t","name":"Время","unit":"с"},{"symbol":"\\varphi_0","name":"Начальная фаза","unit":"рад"}],"conditions":"Плоская гармоническая волна вдоль оси Ox, без затухания. Знак «−» — волна бежит в сторону +x, знак «+» — навстречу. Точка x повторяет колебание источника с запаздыванием x/v.","derivation":{"kind":"derivation","steps":[["Исходное","источник в точке $x = 0$ колеблется как $\\xi(0,t) = A\\cos(\\omega t + \\varphi_0)$"],["Подстановка","в точку $x$ колебание приходит с запаздыванием $\\dfrac{x}{v}$, значит $t \\to t - \\dfrac{x}{v}$"],["Итог","$\\xi = A\\cos\\left(\\omega t - \\dfrac{\\omega}{v}\\,x + \\varphi_0\\right)$, то есть $k = \\dfrac{\\omega}{v} = \\dfrac{2\\pi}{\\lambda}$"]]}},
      {"id":"wave_phase_diff","category":"waves","subCategory":"Механические волны","title":"Разность фаз двух точек волны","latex":"\\Delta\\varphi = 2\\pi\\,\\frac{\\Delta x}{\\lambda}","variables":[{"symbol":"\\Delta\\varphi","name":"Разность фаз колебаний точек","unit":"рад"},{"symbol":"\\Delta x","name":"Расстояние между точками вдоль луча","unit":"м"},{"symbol":"\\lambda","name":"Длина волны","unit":"м"}],"conditions":"Две точки на одном луче. Δx = λ — колебания в одной фазе, Δx = λ/2 — в противофазе (Δφ = π).","derivation":{"kind":"derivation","steps":[["Исходное","точка на расстоянии $\\Delta x$ повторяет колебание с запаздыванием $\\Delta t = \\dfrac{\\Delta x}{v}$"],["Подстановка","$\\Delta\\varphi = \\omega\\,\\Delta t = \\dfrac{2\\pi}{T}\\cdot\\dfrac{\\Delta x}{v}$"],["Итог","так как $vT = \\lambda$, получаем $\\Delta\\varphi = 2\\pi\\dfrac{\\Delta x}{\\lambda}$"]]}},
      {"id":"wave_string_speed","category":"waves","subCategory":"Механические волны","title":"Скорость поперечной волны в струне","latex":"v = \\sqrt{\\frac{F}{\\mu}}","variables":[{"symbol":"v","name":"Скорость волны","unit":"м/с"},{"symbol":"F","name":"Сила натяжения струны","unit":"Н"},{"symbol":"\\mu","name":"Линейная плотность (масса единицы длины, μ = m/l)","unit":"кг/м"}],"conditions":"Гибкая струна, малые смещения. Чем больше натяжение и меньше линейная плотность, тем быстрее волна. Скорость не зависит от частоты и амплитуды.","derivation":{"kind":"derivation","steps":[["Исходное","в системе отсчёта волны малый участок длиной $\\Delta l$ движется со скоростью $v$ по дуге радиуса $R$; силы натяжения на концах дают равнодействующую к центру $F\\dfrac{\\Delta l}{R}$"],["Подстановка","второй закон Ньютона: $\\mu\\,\\Delta l\\,\\dfrac{v^2}{R} = F\\dfrac{\\Delta l}{R}$"],["Итог","$v^2 = \\dfrac{F}{\\mu}$, $v = \\sqrt{\\dfrac{F}{\\mu}}$"]]}},
      {"id":"wave_standing_nodes","category":"waves","subCategory":"Стоячие волны","title":"Расстояние между соседними узлами (пучностями) стоячей волны","latex":"d = \\frac{\\lambda}{2}","variables":[{"symbol":"d","name":"Расстояние между соседними узлами (или пучностями)","unit":"м"},{"symbol":"\\lambda","name":"Длина бегущей волны","unit":"м"}],"conditions":"Стоячая волна — сумма бегущей и отражённой волн. Узлы не колеблются, в пучностях амплитуда равна 2A. Между соседними узлами все точки колеблются в одной фазе, при переходе через узел фаза меняется на π.","derivation":{"kind":"derivation","steps":[["Исходное","сумма встречных волн: $A\\cos(\\omega t - kx) + A\\cos(\\omega t + kx) = 2A\\cos kx\\,\\cos\\omega t$"],["Подстановка","узлы там, где $\\cos kx = 0$, то есть $kx = \\dfrac{\\pi}{2} + \\pi n$; у соседних узлов $kx$ отличается на $\\pi$"],["Итог","$d = \\dfrac{\\pi}{k} = \\dfrac{\\lambda}{2}$"]]}},
      {"id":"wave_string_freq","category":"waves","subCategory":"Стоячие волны","title":"Собственные частоты струны и открытой трубы","latex":"\\nu_n = \\frac{n\\,v}{2\\,l}","variables":[{"symbol":"\\nu_n","name":"Частота n-й гармоники","unit":"Гц"},{"symbol":"n","name":"Номер гармоники (1, 2, 3, …)","unit":"—"},{"symbol":"v","name":"Скорость волны","unit":"м/с"},{"symbol":"l","name":"Длина струны (трубы)","unit":"м"}],"conditions":"Струна, закреплённая с обоих концов (на концах узлы), или труба, открытая с обоих концов (на концах пучности). n = 1 — основной тон, n ≥ 2 — обертоны. На длине укладывается целое число полуволн: l = nλ/2.","derivation":{"kind":"derivation","steps":[["Исходное","на концах узлы, значит на длине $l$ укладывается целое число полуволн: $l = n\\dfrac{\\lambda}{2}$"],["Подстановка","$\\lambda = \\dfrac{2l}{n}$, а $\\nu = \\dfrac{v}{\\lambda}$"],["Итог","$\\nu_n = \\dfrac{n\\,v}{2\\,l}$"]]}},
      {"id":"wave_closed_pipe","category":"waves","subCategory":"Стоячие волны","title":"Собственные частоты трубы, закрытой с одного конца","latex":"\\nu_n = \\frac{(2n - 1)\\,v}{4\\,l}","variables":[{"symbol":"\\nu_n","name":"Частота n-й гармоники","unit":"Гц"},{"symbol":"n","name":"Номер гармоники (1, 2, 3, …)","unit":"—"},{"symbol":"v","name":"Скорость звука","unit":"м/с"},{"symbol":"l","name":"Длина трубы","unit":"м"}],"conditions":"На закрытом конце узел, на открытом пучность; на длине укладывается нечётное число четвертей волны. Звучат только нечётные гармоники (1, 3, 5, …), основной тон вдвое ниже, чем у открытой трубы той же длины.","derivation":{"kind":"derivation","steps":[["Исходное","узел на закрытом конце и пучность на открытом: $l = (2n - 1)\\dfrac{\\lambda}{4}$"],["Подстановка","$\\lambda = \\dfrac{4l}{2n - 1}$, а $\\nu = \\dfrac{v}{\\lambda}$"],["Итог","$\\nu_n = \\dfrac{(2n - 1)\\,v}{4\\,l}$"]]}},
      {"id":"wave_interf_max","category":"waves","subCategory":"Интерференция и эффект Доплера","title":"Условие интерференционного максимума","latex":"\\Delta = n\\,\\lambda","variables":[{"symbol":"\\Delta","name":"Разность хода волн","unit":"м"},{"symbol":"n","name":"Целое число (0, ±1, ±2, …)","unit":"—"},{"symbol":"\\lambda","name":"Длина волны","unit":"м"}],"conditions":"Когерентные источники (одинаковая частота, постоянная разность фаз), колеблющиеся в одной фазе. Волны приходят в точку в одной фазе и усиливают друг друга. Для источников в противофазе условия максимума и минимума меняются местами.","derivation":{"kind":"derivation","steps":[["Исходное","разность фаз волн в точке $\\Delta\\varphi = 2\\pi\\dfrac{\\Delta}{\\lambda}$"],["Подстановка","усиление при $\\Delta\\varphi = 2\\pi n$"],["Итог","$\\Delta = n\\lambda$"]]}},
      {"id":"wave_interf_min","category":"waves","subCategory":"Интерференция и эффект Доплера","title":"Условие интерференционного минимума","latex":"\\Delta = (2n + 1)\\,\\frac{\\lambda}{2}","variables":[{"symbol":"\\Delta","name":"Разность хода волн","unit":"м"},{"symbol":"n","name":"Целое число (0, ±1, ±2, …)","unit":"—"},{"symbol":"\\lambda","name":"Длина волны","unit":"м"}],"conditions":"Когерентные источники в одной фазе. Волны приходят в противофазе и гасят друг друга; при равных амплитудах колебаний в точке нет.","derivation":{"kind":"derivation","steps":[["Исходное","разность фаз волн в точке $\\Delta\\varphi = 2\\pi\\dfrac{\\Delta}{\\lambda}$"],["Подстановка","ослабление при $\\Delta\\varphi = \\pi(2n + 1)$"],["Итог","$\\Delta = (2n + 1)\\dfrac{\\lambda}{2}$"]]}},
      {"id":"wave_doppler","category":"waves","subCategory":"Интерференция и эффект Доплера","title":"Эффект Доплера для звука","latex":"\\nu' = \\nu\\,\\frac{v + v_o}{v - v_s}","variables":[{"symbol":"\\nu'","name":"Частота, воспринимаемая наблюдателем","unit":"Гц"},{"symbol":"\\nu","name":"Частота источника","unit":"Гц"},{"symbol":"v","name":"Скорость звука в среде","unit":"м/с"},{"symbol":"v_o","name":"Скорость наблюдателя","unit":"м/с"},{"symbol":"v_s","name":"Скорость источника","unit":"м/с"}],"conditions":"Движение вдоль прямой, соединяющей источник и наблюдателя. Скорости v_o и v_s положительны при сближении (наблюдатель к источнику, источник к наблюдателю) и отрицательны при удалении. При сближении частота выше, при удалении ниже.","derivation":{"kind":"derivation","steps":[["Исходное","движущийся источник излучает волны длиной $\\lambda' = \\dfrac{v - v_s}{\\nu}$; относительно наблюдателя волны бегут со скоростью $v + v_o$"],["Подстановка","частота приёма — число длин волн, проходящих мимо наблюдателя за секунду: $\\nu' = \\dfrac{v + v_o}{\\lambda'}$"],["Итог","$\\nu' = \\nu\\,\\dfrac{v + v_o}{v - v_s}$"]]}},
      {"id":"snd_intensity","category":"waves","subCategory":"Звук","title":"Интенсивность волны","latex":"I = \\frac{P}{S}","variables":[{"symbol":"I","name":"Интенсивность волны","unit":"Вт/м²"},{"symbol":"P","name":"Мощность, переносимая волной через поверхность","unit":"Вт"},{"symbol":"S","name":"Площадь поверхности, перпендикулярной лучу","unit":"м²"}],"conditions":"Интенсивность — энергия, проходящая за 1 с через 1 м² площадки, перпендикулярной направлению волны: I = E/(St). Для точечного источника мощностью P₀ на расстоянии r: I = P₀/(4πr²), то есть убывает как 1/r². Порог слышимости I₀ = 10⁻¹² Вт/м².","derivation":{"kind":"derivation","steps":[["Исходное","по определению $I = \\dfrac{E}{S\\,t}$, где $E$ — энергия, прошедшая через площадку $S$ за время $t$"],["Подстановка","мощность $P = \\dfrac{E}{t}$"],["Итог","$I = \\dfrac{P}{S}$"]]}},
      {"id":"snd_level","category":"waves","subCategory":"Звук","title":"Уровень интенсивности звука (децибелы)","latex":"L = 10\\,\\lg\\frac{I}{I_0}","variables":[{"symbol":"L","name":"Уровень интенсивности звука","unit":"дБ"},{"symbol":"I","name":"Интенсивность звука","unit":"Вт/м²"},{"symbol":"I_0","name":"Порог слышимости (10⁻¹² Вт/м²)","unit":"Вт/м²"}],"conditions":"Слух реагирует на отношение интенсивностей, поэтому шкала логарифмическая. Рост интенсивности в 10 раз даёт +10 дБ, в 2 раза примерно +3 дБ. Болевой порог около 120–130 дБ.","derivation":{"kind":"derivation","steps":[["Исходное","ощущаемая громкость пропорциональна логарифму интенсивности (закон Вебера–Фехнера)"],["Подстановка","за единицу (бел) берут $\\lg\\dfrac{I}{I_0}$; децибел — десятая часть бела"],["Итог","$L = 10\\,\\lg\\dfrac{I}{I_0}$"]]}},
      {"id":"snd_echo","category":"waves","subCategory":"Звук","title":"Расстояние до преграды по времени эха","latex":"s = \\frac{v\\,t}{2}","variables":[{"symbol":"s","name":"Расстояние до преграды","unit":"м"},{"symbol":"v","name":"Скорость волны (звука; в радиолокации — света)","unit":"м/с"},{"symbol":"t","name":"Время от сигнала до приёма отражённого сигнала","unit":"с"}],"conditions":"Эхо, эхолот, радиолокатор. Сигнал проходит путь до преграды и обратно, поэтому делим пополам. Преграда неподвижна, скорость волны постоянна.","derivation":{"kind":"derivation","steps":[["Исходное","сигнал проходит путь $2s$ (туда и обратно) со скоростью $v$ за время $t$"],["Подстановка","$2s = v\\,t$"],["Итог","$s = \\dfrac{v\\,t}{2}$"]]}},
      {"id":"emo_thomson","category":"emo","subCategory":"Электромагнитные колебания","title":"Формула Томсона (период колебательного контура)","latex":"T = 2\\pi\\sqrt{L\\,C}","variables":[{"symbol":"T","name":"Период свободных колебаний в контуре","unit":"с"},{"symbol":"L","name":"Индуктивность катушки","unit":"Гн"},{"symbol":"C","name":"Ёмкость конденсатора","unit":"Ф"}],"conditions":"Идеальный LC-контур: нет активного сопротивления и излучения. Аналогия с пружинным маятником: L ↔ m, 1/C ↔ k, q ↔ x, i ↔ v.","derivation":{"kind":"derivation","steps":[["Исходное","сумма напряжений в контуре без сопротивления: $L\\,q'' + \\dfrac{q}{C} = 0$, где $i = q'$"],["Подстановка","$q'' = -\\dfrac{1}{LC}\\,q$ — уравнение гармонических колебаний с $\\omega_0^2 = \\dfrac{1}{LC}$"],["Итог","$T = \\dfrac{2\\pi}{\\omega_0} = 2\\pi\\sqrt{LC}$"]]}},
      {"id":"emo_omega","category":"emo","subCategory":"Электромагнитные колебания","title":"Собственная циклическая частота контура","latex":"\\omega_0 = \\frac{1}{\\sqrt{L\\,C}}","variables":[{"symbol":"\\omega_0","name":"Собственная циклическая частота","unit":"рад/с"},{"symbol":"L","name":"Индуктивность катушки","unit":"Гн"},{"symbol":"C","name":"Ёмкость конденсатора","unit":"Ф"}],"conditions":"Идеальный контур. Частота растёт при уменьшении L и C. Это частота, на которую настраивают радиоприёмник (резонанс).","derivation":{"kind":"derivation","steps":[["Исходное","$\\omega_0 = \\dfrac{2\\pi}{T}$ и $T = 2\\pi\\sqrt{LC}$"],["Подстановка","$\\omega_0 = \\dfrac{2\\pi}{2\\pi\\sqrt{LC}}$"],["Итог","$\\omega_0 = \\dfrac{1}{\\sqrt{LC}}$"]]}},
      {"id":"emo_charge","category":"emo","subCategory":"Электромагнитные колебания","title":"Заряд конденсатора в контуре","latex":"q(t) = q_m\\cos(\\omega_0\\,t + \\varphi_0)","variables":[{"symbol":"q","name":"Заряд конденсатора","unit":"Кл"},{"symbol":"q_m","name":"Амплитуда заряда","unit":"Кл"},{"symbol":"\\omega_0","name":"Собственная циклическая частота","unit":"рад/с"},{"symbol":"t","name":"Время","unit":"с"},{"symbol":"\\varphi_0","name":"Начальная фаза","unit":"рад"}],"conditions":"Ток i = q′ = −ω₀q_m·sin(ω₀t + φ₀) опережает заряд по фазе на π/2: когда заряд максимален, ток равен нулю, и наоборот. Напряжение на конденсаторе u = q/C колеблется в фазе с зарядом.","derivation":{"kind":"derivation","steps":[["Исходное","уравнение контура $q'' = -\\omega_0^2 q$ совпадает с уравнением осциллятора $a = -\\omega_0^2 x$"],["Подстановка","по аналогии $x \\to q$, $A \\to q_m$"],["Итог","$q(t) = q_m\\cos(\\omega_0 t + \\varphi_0)$"]]}},
      {"id":"emo_current_amp","category":"emo","subCategory":"Электромагнитные колебания","title":"Амплитуда тока в контуре","latex":"I_m = \\omega_0\\,q_m","variables":[{"symbol":"I_m","name":"Амплитуда силы тока","unit":"А"},{"symbol":"\\omega_0","name":"Собственная циклическая частота","unit":"рад/с"},{"symbol":"q_m","name":"Амплитуда заряда","unit":"Кл"}],"conditions":"Ток максимален, когда конденсатор полностью разряжен (вся энергия в катушке). Аналог v_max = ω₀A. Также I_m = q_m/√(LC).","derivation":{"kind":"derivation","steps":[["Исходное","$i = q' = -\\omega_0 q_m\\sin(\\omega_0 t + \\varphi_0)$"],["Подстановка","модуль синуса не больше 1"],["Итог","$I_m = \\omega_0 q_m$"]]}},
      {"id":"emo_energy","category":"emo","subCategory":"Электромагнитные колебания","title":"Энергия колебательного контура","latex":"\\frac{q^2}{2\\,C} + \\frac{L\\,i^2}{2} = \\frac{q_m^2}{2\\,C} = \\frac{L\\,I_m^2}{2}","variables":[{"symbol":"q","name":"Заряд конденсатора","unit":"Кл"},{"symbol":"C","name":"Ёмкость конденсатора","unit":"Ф"},{"symbol":"L","name":"Индуктивность катушки","unit":"Гн"},{"symbol":"i","name":"Сила тока","unit":"А"},{"symbol":"q_m","name":"Амплитуда заряда","unit":"Кл"},{"symbol":"I_m","name":"Амплитуда силы тока","unit":"А"}],"conditions":"Потерь нет. Энергия электрического поля конденсатора q²/(2C) и магнитного поля катушки Li²/2 перетекают друг в друга, сумма постоянна. Энергия колеблется с частотой 2ν.","derivation":{"kind":"derivation","steps":[["Исходное","при $q = q_m$ ток $i = 0$: вся энергия в конденсаторе, $W = \\dfrac{q_m^2}{2C}$"],["Подстановка","при $q = 0$ ток максимален: $W = \\dfrac{L I_m^2}{2}$; потерь нет, энергия сохраняется"],["Итог","$\\dfrac{q^2}{2C} + \\dfrac{Li^2}{2} = \\dfrac{q_m^2}{2C} = \\dfrac{L I_m^2}{2}$"]]}},
      {"id":"ac_voltage","category":"emo","subCategory":"Переменный ток","title":"Переменное напряжение (гармонический закон)","latex":"u(t) = U_m\\cos(\\omega\\,t + \\varphi_0)","variables":[{"symbol":"u","name":"Мгновенное значение напряжения","unit":"В"},{"symbol":"U_m","name":"Амплитуда напряжения","unit":"В"},{"symbol":"\\omega","name":"Циклическая частота","unit":"рад/с"},{"symbol":"t","name":"Время","unit":"с"},{"symbol":"\\varphi_0","name":"Начальная фаза","unit":"рад"}],"conditions":"Переменный ток создаёт генератор, в котором рамка вращается в магнитном поле. В сети ω = 2πν, при ν = 50 Гц ω ≈ 314 рад/с. Для тока аналогично: i = I_m cos(ωt + φ_i); сдвиг фаз между u и i зависит от цепи.","derivation":{"kind":"derivation","steps":[["Исходное","рамка из $N$ витков вращается с угловой скоростью $\\omega$ в поле $B$: поток $\\Phi = BS\\cos\\omega t$"],["Подстановка","закон Фарадея: $e = -N\\Phi' = NBS\\omega\\sin\\omega t$"],["Итог","ЭДС и напряжение меняются по гармоническому закону: $u = U_m\\cos(\\omega t + \\varphi_0)$, где $U_m = NBS\\omega$"]]}},
      {"id":"ac_rms_u","category":"emo","subCategory":"Переменный ток","title":"Действующее значение напряжения","latex":"U = \\frac{U_m}{\\sqrt{2}}","variables":[{"symbol":"U","name":"Действующее (эффективное) напряжение","unit":"В"},{"symbol":"U_m","name":"Амплитуда напряжения","unit":"В"}],"conditions":"Равно напряжению постоянного тока, выделяющего в резисторе такую же мощность. Для тока так же: I = I_m/√2. Приборы показывают именно действующие значения: сеть 220 В означает U_m ≈ 311 В.","derivation":{"kind":"derivation","steps":[["Исходное","средняя мощность на резисторе: $\\overline{P} = \\dfrac{U_m^2}{R}\\,\\overline{\\cos^2\\omega t} = \\dfrac{U_m^2}{2R}$ (среднее от $\\cos^2$ равно $\\dfrac{1}{2}$)"],["Подстановка","приравниваем к мощности постоянного тока $\\dfrac{U^2}{R}$"],["Итог","$U = \\dfrac{U_m}{\\sqrt{2}}$"]]}},
      {"id":"ac_xl","category":"emo","subCategory":"Переменный ток","title":"Индуктивное сопротивление","latex":"X_L = \\omega\\,L","variables":[{"symbol":"X_L","name":"Индуктивное сопротивление","unit":"Ом"},{"symbol":"\\omega","name":"Циклическая частота тока","unit":"рад/с"},{"symbol":"L","name":"Индуктивность катушки","unit":"Гн"}],"conditions":"Чем выше частота, тем катушка «сопротивляется» сильнее (на постоянном токе X_L = 0). Напряжение на катушке опережает ток по фазе на π/2. Мощность не потребляется.","derivation":{"kind":"derivation","steps":[["Исходное","ток $i = I_m\\cos\\omega t$; напряжение на катушке уравновешивает ЭДС самоиндукции: $u = L\\,i'$"],["Подстановка","$u = -\\omega L I_m\\sin\\omega t$, амплитуда $U_m = \\omega L\\,I_m$"],["Итог","$X_L = \\dfrac{U_m}{I_m} = \\omega L$"]]}},
      {"id":"ac_xc","category":"emo","subCategory":"Переменный ток","title":"Ёмкостное сопротивление","latex":"X_C = \\frac{1}{\\omega\\,C}","variables":[{"symbol":"X_C","name":"Ёмкостное сопротивление","unit":"Ом"},{"symbol":"\\omega","name":"Циклическая частота тока","unit":"рад/с"},{"symbol":"C","name":"Ёмкость конденсатора","unit":"Ф"}],"conditions":"Конденсатор пропускает переменный ток тем лучше, чем выше частота (на постоянном токе X_C → ∞). Напряжение на конденсаторе отстаёт от тока по фазе на π/2. Мощность не потребляется.","derivation":{"kind":"derivation","steps":[["Исходное","напряжение на конденсаторе $u = U_m\\cos\\omega t$, заряд $q = Cu$"],["Подстановка","ток $i = q' = -\\omega C U_m\\sin\\omega t$, амплитуда $I_m = \\omega C\\,U_m$"],["Итог","$X_C = \\dfrac{U_m}{I_m} = \\dfrac{1}{\\omega C}$"]]}},
      {"id":"ac_impedance","category":"emo","subCategory":"Переменный ток","title":"Полное сопротивление последовательной RLC-цепи","latex":"Z = \\sqrt{R^2 + \\left(\\omega L - \\frac{1}{\\omega C}\\right)^2}","variables":[{"symbol":"Z","name":"Полное сопротивление (импеданс)","unit":"Ом"},{"symbol":"R","name":"Активное сопротивление","unit":"Ом"},{"symbol":"\\omega","name":"Циклическая частота тока","unit":"рад/с"},{"symbol":"L","name":"Индуктивность катушки","unit":"Гн"},{"symbol":"C","name":"Ёмкость конденсатора","unit":"Ф"}],"conditions":"Резистор, катушка и конденсатор соединены последовательно. Закон Ома для амплитуд и действующих значений: I = U/Z. Реактивные сопротивления вычитаются (колеблются в противофазе). При ωL = 1/(ωC), то есть ω = 1/√(LC), Z = R минимально: резонанс напряжений.","derivation":{"kind":"derivation","steps":[["Исходное","через все элементы течёт один ток; амплитуды напряжений: $U_R = I_m R$, $U_L = I_m X_L$, $U_C = I_m X_C$, причём $U_L$ и $U_C$ в противофазе"],["Подстановка","векторная диаграмма и теорема Пифагора: $U_m^2 = U_R^2 + (U_L - U_C)^2 = I_m^2\\left[R^2 + (X_L - X_C)^2\\right]$"],["Итог","$Z = \\dfrac{U_m}{I_m} = \\sqrt{R^2 + \\left(\\omega L - \\dfrac{1}{\\omega C}\\right)^2}$"]]}},
      {"id":"ac_power","category":"emo","subCategory":"Переменный ток","title":"Средняя мощность переменного тока","latex":"P = U\\,I\\cos\\varphi","variables":[{"symbol":"P","name":"Средняя мощность","unit":"Вт"},{"symbol":"U","name":"Действующее напряжение","unit":"В"},{"symbol":"I","name":"Действующая сила тока","unit":"А"},{"symbol":"\\varphi","name":"Сдвиг фаз между напряжением и током","unit":"рад"}],"conditions":"cos φ — коэффициент мощности. Для резистора φ = 0 и P = UI; для идеальных катушки и конденсатора φ = ±π/2 и P = 0 (энергия лишь перекачивается). В RLC-цепи cos φ = R/Z и P = I²R.","derivation":{"kind":"derivation","steps":[["Исходное","$u = U_m\\cos\\omega t$, $i = I_m\\cos(\\omega t - \\varphi)$, мгновенная мощность $p = ui$"],["Подстановка","среднее за период: $\\overline{\\cos\\omega t\\,\\cos(\\omega t - \\varphi)} = \\dfrac{1}{2}\\cos\\varphi$"],["Итог","$P = \\dfrac{U_m I_m}{2}\\cos\\varphi = UI\\cos\\varphi$"]]}},
      {"id":"ac_transformer","category":"emo","subCategory":"Переменный ток","title":"Идеальный трансформатор","latex":"\\frac{U_1}{U_2} = \\frac{N_1}{N_2} = \\frac{I_2}{I_1}","variables":[{"symbol":"U_1","name":"Напряжение на первичной обмотке","unit":"В"},{"symbol":"U_2","name":"Напряжение на вторичной обмотке","unit":"В"},{"symbol":"N_1","name":"Число витков первичной обмотки","unit":"—"},{"symbol":"N_2","name":"Число витков вторичной обмотки","unit":"—"},{"symbol":"I_1","name":"Сила тока в первичной обмотке","unit":"А"},{"symbol":"I_2","name":"Сила тока во вторичной обмотке","unit":"А"}],"conditions":"Потерь нет: P₁ = P₂. Коэффициент трансформации N₁/N₂ > 1 — понижающий трансформатор, < 1 — повышающий. Повышение напряжения в n раз уменьшает ток в n раз (передача энергии на большие расстояния).","derivation":{"kind":"derivation","steps":[["Исходное","поток общий, ЭДС индукции в обмотках: $e_1 = N_1\\Phi'$, $e_2 = N_2\\Phi'$; в идеальном случае $U_1 = e_1$, $U_2 = e_2$"],["Подстановка","отсюда $\\dfrac{U_1}{U_2} = \\dfrac{N_1}{N_2}$; потерь нет, значит $U_1 I_1 = U_2 I_2$"],["Итог","$\\dfrac{U_1}{U_2} = \\dfrac{N_1}{N_2} = \\dfrac{I_2}{I_1}$"]]}},
      {"id":"emw_speed","category":"emw","subCategory":"Электромагнитные волны","title":"Скорость электромагнитной волны в вакууме","latex":"c = \\lambda\\,\\nu = \\frac{1}{\\sqrt{\\varepsilon_0\\,\\mu_0}}","variables":[{"symbol":"c","name":"Скорость света в вакууме (≈ 3·10⁸ м/с)","unit":"м/с"},{"symbol":"\\lambda","name":"Длина волны","unit":"м"},{"symbol":"\\nu","name":"Частота","unit":"Гц"},{"symbol":"\\varepsilon_0","name":"Электрическая постоянная","unit":"Ф/м"},{"symbol":"\\mu_0","name":"Магнитная постоянная","unit":"Гн/м"}],"conditions":"В вакууме все электромагнитные волны (радио, свет, рентген) распространяются с одной скоростью c. Волны поперечные: векторы E и B перпендикулярны друг другу и направлению распространения. Равенство c = 1/√(ε₀μ₀) следует из уравнений Максвелла.","derivation":{"kind":"derivation","steps":[["Исходное","уравнения Максвелла дают для полей волновое уравнение со скоростью $c = \\dfrac{1}{\\sqrt{\\varepsilon_0\\mu_0}}$"],["Подстановка","$\\varepsilon_0 \\approx 8{,}85\\cdot10^{-12}$ Ф/м, $\\mu_0 = 4\\pi\\cdot10^{-7}$ Гн/м, получаем $c \\approx 3\\cdot10^{8}$ м/с"],["Итог","$c = \\lambda\\nu = \\dfrac{1}{\\sqrt{\\varepsilon_0\\mu_0}}$ (первое равенство — связь скорости, длины и частоты любой волны)"]]}},
      {"id":"emw_medium","category":"emw","subCategory":"Электромагнитные волны","title":"Скорость электромагнитной волны в среде","latex":"v = \\frac{c}{\\sqrt{\\varepsilon\\,\\mu}} = \\frac{c}{n}","variables":[{"symbol":"v","name":"Скорость волны в среде","unit":"м/с"},{"symbol":"c","name":"Скорость света в вакууме","unit":"м/с"},{"symbol":"\\varepsilon","name":"Диэлектрическая проницаемость среды","unit":"—"},{"symbol":"\\mu","name":"Магнитная проницаемость среды","unit":"—"},{"symbol":"n","name":"Показатель преломления среды","unit":"—"}],"conditions":"Прозрачная среда. Для большинства прозрачных веществ μ ≈ 1, поэтому n ≈ √ε. При переходе в среду частота не меняется, длина волны уменьшается в n раз: λ = λ₀/n.","derivation":{"kind":"derivation","steps":[["Исходное","в среде $v = \\dfrac{1}{\\sqrt{\\varepsilon\\varepsilon_0\\mu\\mu_0}}$"],["Подстановка","делим на $c = \\dfrac{1}{\\sqrt{\\varepsilon_0\\mu_0}}$: $\\dfrac{v}{c} = \\dfrac{1}{\\sqrt{\\varepsilon\\mu}}$"],["Итог","$v = \\dfrac{c}{\\sqrt{\\varepsilon\\mu}}$; по определению $n = \\dfrac{c}{v} = \\sqrt{\\varepsilon\\mu}$"]]}},
      {"id":"emw_lc_length","category":"emw","subCategory":"Электромагнитные волны","title":"Длина волны, излучаемой колебательным контуром","latex":"\\lambda = 2\\pi\\,c\\sqrt{L\\,C}","variables":[{"symbol":"\\lambda","name":"Длина излучаемой волны","unit":"м"},{"symbol":"c","name":"Скорость света в вакууме","unit":"м/с"},{"symbol":"L","name":"Индуктивность катушки","unit":"Гн"},{"symbol":"C","name":"Ёмкость конденсатора","unit":"Ф"}],"conditions":"Контур излучает и принимает волны с частотой собственных колебаний. Радиоприёмник настраивают изменением C (или L) до резонанса с нужной станцией. Длина волны растёт с L и C.","derivation":{"kind":"derivation","steps":[["Исходное","длина волны $\\lambda = cT$, период контура $T = 2\\pi\\sqrt{LC}$ (формула Томсона)"],["Подстановка","подставляем $T$ в $\\lambda = cT$"],["Итог","$\\lambda = 2\\pi c\\sqrt{LC}$"]]}}
    ];
    const OSC_ORDER = ["osc_period_freq","osc_omega","osc_coordinate","osc_velocity","osc_velocity_x","osc_acceleration","osc_accel_max","osc_spring_omega","osc_spring_period","osc_pendulum_omega","osc_pendulum_period","osc_physical_pendulum","osc_springs_series","osc_springs_parallel","osc_energy","osc_energy_any","osc_damped_amp","osc_damped_omega","osc_resonance","wave_speed","wave_equation","wave_phase_diff","wave_string_speed","wave_standing_nodes","wave_string_freq","wave_closed_pipe","wave_interf_max","wave_interf_min","wave_doppler","snd_intensity","snd_level","snd_echo","emo_thomson","emo_omega","emo_charge","emo_current_amp","emo_energy","ac_voltage","ac_rms_u","ac_xl","ac_xc","ac_impedance","ac_power","ac_transformer","emw_speed","emw_medium","emw_lc_length"];
    const OSC_DATA = [...MECHANICS_DATA.filter((f) => f.category === 'oscillations'), ...OSC_NEW]
      .sort((a, b) => { const i = OSC_ORDER.indexOf(a.id), j = OSC_ORDER.indexOf(b.id); return (i < 0 ? 999 : i) - (j < 0 ? 999 : j); });

    const CAT_ALL = Object.assign({}, CAT_LABELS, MKT_LABELS, ED_LABELS, OSC_LABELS);
    const SECTIONS = {
      mechanics: { name: 'Механика', data: MECHANICS_DATA, cats: CAT_LABELS },
      mkt: { name: 'МКТ и термодинамика', data: MKT_DATA, cats: MKT_LABELS },
      electro: { name: 'Электродинамика', data: ED_DATA, cats: ED_LABELS },
      oscillations: { name: 'Колебания и волны', data: OSC_DATA, cats: OSC_LABELS, noTrain: true }   // noTrain: пока только справочник
    };
    // Заглушка для разделов, у которых ещё нет тестов и блица
    const noTrainHTML = () => `<div class="mx-auto max-w-xl"><p class="sec">Тренажёр и блиц для раздела «${esc(SECTIONS[SEC].name)}» появятся позже. Пока доступен справочник.</p></div>`;
    let SEC = 'mechanics';
    const HBD = () => SECTIONS[SEC].data;
    const plForm = (n) => (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 'формулы' : 'формул';
    const BTN = 'rounded-lg border px-3 py-1.5 text-xs font-medium transition-colors';
    const LEARN_ON = 'border-emerald-500/40 bg-emerald-500/10 text-emerald-400';
    const LEARN_OFF = 'border-slate-800 bg-slate-900 text-slate-400 hover:text-slate-100';
    const BTN_BIG = 'flex w-full items-center justify-between rounded-xl border border-slate-800 bg-slate-900/60 px-4 py-3 text-left text-sm text-slate-200 transition-colors hover:border-cyan-500/40 hover:text-cyan-400';
    const BTN_PRIMARY = 'w-full rounded-xl bg-cyan-500 px-4 py-3 text-sm font-semibold text-zinc-950 transition-colors hover:bg-cyan-400';
    const FORMULA_BOX = 'fbox overflow-x-auto text-slate-100';

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    function shuffle(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }

    // Прогресс хранится в localStorage этого браузера (с защитой на случай, если он недоступен)
    const Store = {
      key: 'mechcore.v1',
      s: { learned: [], blitzBest: 0, streakBest: 0, stats: {}, ui: { vib: true } },
      load() { try { Object.assign(this.s, JSON.parse(localStorage.getItem(this.key)) || {}); } catch (e) { /* хранилище недоступно */ } if (!this.s.stats || typeof this.s.stats !== 'object' || Array.isArray(this.s.stats)) this.s.stats = {}; if (!Array.isArray(this.s.learned)) this.s.learned = []; this.s.blitzBest = +this.s.blitzBest || 0; this.s.streakBest = +this.s.streakBest || 0; },

    window.addEventListener('scroll', () => { if (window.scrollX !== 0) window.scrollTo(0, window.scrollY); }, { passive: true });


    // ───────── 7. Вкладки и запуск ─────────
    const TABS = ['handbook', 'trainer', 'blitz'];
    const TAB_CLASS_ACTIVE = ['tab-on'];
    const TAB_CLASS_IDLE = ['tab-off'];
    let activeTab = 'handbook';
    // Содержимое вкладки обновляется ДО того, как она показана (иначе после свайпа страница перерисовывается на глазах).
    // Событие 'mechcore:tabprepare' (detail: { tab }) приходит один раз за переход, пока вкладка ещё скрыта.
    let preparedTab = null;
    function prepareTab(name) {
      if (preparedTab === name) return;
      preparedTab = name;
      document.dispatchEvent(new CustomEvent('mechcore:tabprepare', { detail: { tab: name } }));
    }

    // Страница едет вместе с пальцем: текущая и соседняя вкладки двигаются синхронно.
    // Тот же механизм ведёт и нажатие на кнопку вкладки (без пальца, сразу доводка).
    const TX_MS = 380;                                   // длительность доводки одна и та же при любой скорости свайпа
    const TX_EASE = 'cubic-bezier(.25, 1, .5, 1)';
    const TX = { on: false, cur: null, nb: null, name: null, side: 0, D: 0, x: 0, anims: null, commit: false, timer: 0 };
    const txTr = (x) => 'translate3d(' + x + 'px,0,0)';
    const reducedMotion = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

    // Ставит соседнюю вкладку рядом с текущей (side: +1 — справа, −1 — слева).
    // Она встаёт под шапку на уровне экрана, даже если текущая вкладка прокручена вниз, и обрезана по высоте экрана.
    function txPlace(name) {
      const cur = TX.cur, nb = document.getElementById('tab-' + name), main = cur.parentElement;
      const hd = document.querySelector('.hd'), hb = hd ? hd.getBoundingClientRect().bottom : 0;
      const cr = cur.getBoundingClientRect(), mr = main.getBoundingClientRect();
      const pad = cr.top - mr.top;                        // верхний отступ main
      const top = hb + pad - mr.top;
      const room = Math.max(200, window.innerHeight - hb - pad);
      prepareTab(name);
      nb.classList.remove('hidden');
      nb.style.cssText = 'position:absolute;top:' + top + 'px;left:' + (cr.left - mr.left) + 'px;width:' + cr.width + 'px;max-height:' + room + 'px;overflow:hidden;will-change:transform;transform:' + txTr(TX.x + TX.side * TX.D);
      TX.nb = nb;
    }
    function txStart(name, side) {
      const cur = document.getElementById('tab-' + activeTab), main = cur.parentElement;
      Object.assign(TX, { on: true, cur, nb: null, name, side, x: 0, anims: null, commit: false });
      const cr = cur.getBoundingClientRect();
      const winW = document.documentElement.clientWidth || window.innerWidth;
      TX.D = Math.max(cr.width, Math.min(winW, cr.width + 48));
      main.style.position = 'relative'; main.style.overflowX = 'clip';
      cur.style.willChange = 'transform';
      if (name) txPlace(name);
    }
    function txSetSide(side) {                            // палец перешёл через ноль: соседняя вкладка меняется
      if (TX.nb) { TX.nb.style.cssText = ''; TX.nb.classList.add('hidden'); TX.nb = null; }
      const name = TABS[TABS.indexOf(activeTab) + side] || null;
      TX.name = name; TX.side = side;
      if (name) txPlace(name);
    }
    function txMove(x) {
      TX.x = x;
      TX.cur.style.transform = txTr(x);
      if (TX.nb) TX.nb.style.transform = txTr(x + TX.side * TX.D);
    }
    function txFollow(dx) {
      const side = dx < 0 ? 1 : -1;
      if (dx !== 0 && side !== TX.side) txSetSide(side);
      // у крайних вкладок — лёгкое сопротивление, у остальных страница едет точно за пальцем
      txMove(TX.nb ? Math.max(-TX.D, Math.min(TX.D, dx)) : Math.sign(dx) * 80 * (1 - Math.exp(-Math.abs(dx) / 160)));
    }
    // Доводка: commit — вкладка долетает, иначе возвращается. Время одинаковое.
    function txSettle(commit) {
      TX.commit = commit && !!TX.nb;
      paintTabs(TX.commit ? TX.name : activeTab);         // кнопки вкладок реагируют сразу
      if (!TX.cur.animate) { txDone(); return; }
      const x0 = TX.x, x1 = TX.commit ? -TX.side * TX.D : 0, o = { duration: reducedMotion() ? 1 : TX_MS, easing: TX_EASE, fill: 'forwards' };
      const run = (el, a, b) => el.animate([{ transform: txTr(a) }, { transform: txTr(b) }], o);
      TX.anims = [run(TX.cur, x0, x1)];
      if (TX.nb) {
        const nbAnim = run(TX.nb, x0 + TX.side * TX.D, x1 + TX.side * TX.D);
        TX.anims.push(nbAnim);
        nbAnim.onfinish = txDone;
      } else {

      }

    }
    function txDone() {

      clearTimeout(TX.timer);
      const { cur, nb, name, commit, anims } = TX, main = cur ? cur.parentElement : null;
      TX.on = false; TX.anims = null; TX.cur = TX.nb = null;

      if (commit && name) {
        applyTab(name);
        if (cur) { cur.style.transform = ''; cur.style.willChange = ''; }
        if (nb) nb.style.cssText = '';
        if (main) { main.style.position = ''; main.style.overflowX = ''; }
      } else {
        if (nb) { nb.style.cssText = ''; nb.classList.add('hidden'); }
        if (cur) { cur.style.transform = ''; cur.style.willChange = ''; }
        if (main) { main.style.position = ''; main.style.overflowX = ''; }
        paintTabs(activeTab);
        preparedTab = null;
      }

      (anims || []).forEach((a) => { try { a.cancel(); } catch (e) { /* уже остановлена */ } });
    }
    function txFinishNow() {                              // новый жест или нажатие: прежний переход завершаем сразу
      if (!TX.on) return;
      if (!TX.anims) TX.commit = false;
      txDone();
    }

    // Переключает вкладку и сообщает об этом остальным модулям событием 'mechcore:tabchange'
    // (detail: { tab, prev }) — например, чтобы остановить таймер Блица при уходе с вкладки.
    function switchTab(name) {
      if (!TABS.includes(name)) return;
      txFinishNow();

      if (name === activeTab || !out || !inn || !out.animate || reducedMotion()) { applyTab(name); return; }
      if (window.scrollY > 0) window.scrollTo({ top: 0, behavior: 'instant' });

    function paintTabs(name) {

      });
      paintTitle(name);
    }
    // Название в шапке: на Тренажёре и Блице — раздел физики (Механика, МКТ…), на Справочнике центр пустой.
    // Следует за кнопками вкладок (и при свайпе, и при нажатии), плавно гаснет и проявляется;
    // между Тренажёром и Блицем текст тот же, поэтому не мигает
    const HDT = { timer: 0 };
    function secTitle() {
      const b = document.querySelector('[data-phys-sec="' + SEC + '"]');
      return (b && b.textContent.trim()) || (SECTIONS[SEC] && SECTIONS[SEC].name) || '';
    }
    function paintTitle(name) {
      const el = $('hd-title'); if (!el) return;

    // ───────── Свайпы между вкладками ─────────
    // Свайп влево — следующая вкладка, вправо — предыдущая (Справочник · Тренажёр · Блиц).
    // Страница едет за пальцем; после отпускания долетает, если протянули дальше трети экрана или резко махнули.
    function initSwipe() {

      const blocked = () => !!document.getElementById('splash') || !$('fsheet').hidden || !$('ssheet').hidden || (activeTab === 'blitz' && (BL.running || BL.endTimer)) || (activeTab === 'trainer' && TR.mode === 'ctor' && !CT.done);
      const selecting = () => { const sel = window.getSelection && window.getSelection(); return !!(sel && String(sel).length); };
