      // поле ввода или область, которая реально прокручивается вбок (длинная формула)
      const ownsHorizontal = (el) => {

        if (!gg || gg.axis !== 'x' || !TX.on || TX.anims) return;

        let v = 0;                                          // скорость по последним ~100 мс; если палец перед отрывом остановился, она гаснет
        if (p.length > 1) v = (p[p.length - 1][0] - p[0][0]) / Math.max(now - p[0][1], 16);
        const flick = Math.abs(v) > FLICK && Math.abs(x) > 30;

        const t = e.touches[0], dx = t.clientX - g.x, dy = t.clientY - g.y;

    function setSection(id, first) {

      Store.s.sec = id; Store.save();
      document.body.dataset.psec = id;
      if (window.fxSection) fxSection(id);

      });

      if (!first) {
        switchTab('handbook');
        window.scrollTo({ top: 0, behavior: 'auto' });
        if (window.fx2 && fx2.riseHB) fx2.riseHB();
      }
    }
    function initTabs() {
      const nav = document.getElementById('tabs');
      if (nav) {
        nav.addEventListener('click', (e) => {
          const btn = e.target.closest('[data-tab]');
          if (btn) switchTab(btn.dataset.tab);
        });
      }
      const rail = $('hb-rail');
      if (rail) rail.addEventListener('click', (e) => {
        const b = e.target.closest('[data-phys-sec]'); if (!b || b.disabled) return;

      switchTab(activeTab);
    }

    // Нижняя панель прячется, пока открыта клавиатура (иначе она всплывёт над ней)
    function initNav() {

    function initTheme() {

      const R = document.documentElement;
      const paint = () => {
        const dark = fxTheme.get() === 'dark';

      };

      const swap = (t) => {
        const run = () => { Store.s.ui.theme = t; Store.save(); fxTheme.apply(t); };
        if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return run();

    // ───────── Настройки: размер шрифта, вибрация, сброс прогресса ─────────
    const FS_PX = ['', '17px', '19px'];   // '' — обычный размер из стилей (15px)
    function applyFont() { document.documentElement.style.fontSize = FS_PX[Store.s.ui.fs] || ''; }
    function sPaint() {
      document.querySelectorAll('#s-sz [data-sz]').forEach((b) => { const on = +b.dataset.sz === Store.s.ui.fs; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
    }
    function sConfirm(show) { $('s-conf').hidden = !show; $('s-reset').hidden = show; }
    function sSheet(open) {

    }
    // Сброс: стираются выученные формулы, статистика и рекорды; тема, шрифт и выбранный раздел остаются
    function resetProgress() {

      location.reload();
    }
    function initSettings() {
      applyFont();
      $('set-btn').addEventListener('click', () => { sSheet(true); buzz(8); });
      $('ssheet').addEventListener('click', (e) => {
        if (e.target === $('ssheet') || e.target.closest('[data-s="close"]')) { sSheet(false); return; }
        const z = e.target.closest('[data-sz]');
        if (z) { Store.s.ui.fs = +z.dataset.sz; Store.save(); applyFont(); sPaint(); buzz(8); }
        else if (e.target.closest('#s-reset')) sConfirm(true);
        else if (e.target.closest('#s-no')) sConfirm(false);
        else if (e.target.closest('#s-yes')) resetProgress();

    }

    document.addEventListener('DOMContentLoaded', () => {
      initTabs();
      initSwipe();
      initNav();
      initTheme();
      initSettings();

      const libs = {
        katex: !!window.katex,
        autoRender: typeof window.renderMathInElement === 'function',
        confetti: typeof window.confetti === 'function'
      };
      const missing = Object.keys(libs).filter((name) => !libs[name]);
      if (missing.length) {
        console.warn('[MechCore] Во вшитом коде не найдено: ' + missing.join(', ') + '. Файл мог быть изменён или повреждён.');
      } else {
        console.info('[MechCore] Все библиотеки вшиты в файл, интернет не нужен.');
      }
      // Приложение собрано: даём браузеру отрисовать первые карточки справочника, затем сообщаем заставке
      requestAnimationFrame(() => requestAnimationFrame(() => { window.MC_READY = true; }));
    });
  </script>

  <script id="fx-js">
  (function () {

      // Фон теперь статичный (один источник цвета), проверять плавность не нужно. Сообщаем справочнику, что можно дорисовывать формулы заранее.
      var wait = function () {
        if (document.getElementById('splash')) { setTimeout(wait, 120); return; }
        setTimeout(function () { window.fxProbed = true; document.dispatchEvent(new Event('fx:probed')); }, C.startDelay);
      };
      wait();
      // Цвет источника пока не привязан к теме и разделу: эти вызовы оставлены, чтобы остальной код не менялся.
      window.fxHue = function () {};
      window.fxSection = function () {};
    } catch (e) { /* приложение работает как раньше */ }
  })();
  </script>
<script id="fx2-js">
/* ЧАСТЬ 2. Нажатие, появление карточек, «Выучено», бегущая цифра. Все числа — в window.FX_CFG в начале файла. */
(function () {
  var C = Object.assign({ pressScale: .97, pressIn: 80, pressOut: 200, spring: 'cubic-bezier(.34,1.56,.64,1)', riseDur: 340, riseStep: 40, riseMax: 8, risePx: 10, learnDur: 350, rollDur: 260, fwdDur: 300, edgeFull: 120, warnSec: 10 }, window.FX_CFG || {});

  var $ = function (id) { return document.getElementById(id); };

  // Нажатие: кнопки, плитки и строки чуть «продавливаются» и возвращаются пружиной
  var SEL = 'button,summary,[role=tab],.ct-box,.ct-slot,.ct-el,.ct-end,.ct-bar,.ct-rs', down = [];
  var cur = function (el) { var v = parseFloat(getComputedStyle(el).scale); return isFinite(v) ? v : 1; };
  function release(p) {
    var i = down.indexOf(p); if (i >= 0) down.splice(i, 1);
    var go = function () {
      var s = cur(p.el); p.a.cancel();
      if (s < .9995) p.el.animate([{ scale: String(s) }, { scale: '1' }], { duration: C.pressOut, easing: C.spring });
    };
    var wait = C.pressIn - (performance.now() - p.t);
    if (wait > 0) setTimeout(go, wait); else go();
  }
  if (window.CSS && CSS.supports && CSS.supports('scale', '1')) {
    document.addEventListener('pointerdown', function (e) {
      if (rm() || (e.pointerType === 'mouse' && e.button !== 0)) return;
      var el = e.target.closest && e.target.closest(SEL);
      if (!el || el.disabled || !el.animate) return;
      var a = el.animate([{ scale: String(cur(el)) }, { scale: String(C.pressScale) }], { duration: C.pressIn, easing: 'ease-out', fill: 'forwards' });
      down.push({ el: el, a: a, t: performance.now() });
    }, { passive: true });
    var up = function () { down.slice().forEach(release); };
    document.addEventListener('pointerup', up, { passive: true });
    document.addEventListener('pointercancel', up, { passive: true });
  }

  // Появление: первые карточки поднимаются на risePx и проявляются, каждая позже предыдущей; остальные сразу
  function rise(els) {
    if (rm()) return;
    var a = [].filter.call(els, function (e) { return e.nodeType === 1 && e.getClientRects().length && !e.classList.contains('hidden'); }).slice(0, C.riseMax);
    a.forEach(function (el, i) {
      if (el.animate) el.animate([{ opacity: 0, translate: '0 ' + C.risePx + 'px' }, { opacity: 1, translate: '0 0' }], { duration: C.riseDur, delay: i * C.riseStep, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' });
    });
  }
  function riseRoot(id) { var r = $(id), f = r && r.firstElementChild; if (f) rise(f.children); }
  function riseTab(n) {
    if (n === 'handbook') rise(document.querySelectorAll('#hb-list article:not(.hidden)'));
    else if (n === 'trainer') riseRoot('tr-root');
    else if (n === 'blitz') riseRoot('bl-root');
  }
  document.addEventListener('mechcore:tabprepare', function (e) { requestAnimationFrame(function () { riseTab(e.detail.tab); }); });

  // «Выучено»: галочка рисуется линией
  function learned(b) {
    var p = b.querySelector('.chk path');
    if (rm() || !p || !p.animate) return;
    p.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: C.learnDur, easing: 'ease-out' });
  }
  // Счётчик «8 из 46»: старая цифра уезжает, новая выезжает
  function roll(el, from, to) {
    if (rm() || !el || from === to || !el.animate) return;
    var d = to > from ? 1 : -1, n = el.firstElementChild, o = document.createElement('span');
    o.className = 'rn-old'; o.textContent = from; el.appendChild(o);
    var opt = { duration: C.rollDur, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' };
    n.animate([{ translate: '0 ' + d * 100 + '%', opacity: 0 }, { translate: '0 0', opacity: 1 }], opt);
    o.animate([{ translate: '0 0', opacity: 1 }, { translate: '0 ' + (-d * 100) + '%', opacity: 0 }], opt).onfinish = function () { o.remove(); };
  }
  window.fx2 = { cfg: C, rm: rm, riseHB: function () { riseTab('handbook'); }, learned: learned, roll: roll };
})();
</script>
<script id="redesign-js">
/* Редизайн: только внешний вид. Цвет раздела и сдвиг ±14° по подтемам; на ПК рейка слева (те же элементы, перенесённые в #rail) */
(function () {
  var R = document.documentElement, B = document.body;
  var BASE = { mechanics: 220, mkt: 28, electro: 270, oscillations: 145, optics: 50, quantum: 5 }, base = 220, off = 0;
  function paint(ms) { R.style.setProperty('--hue-dur', ms + 'ms'); R.style.setProperty('--section-hue', String(base + off)); }
  function cats() { return [].map.call(document.querySelectorAll('#hb-chips [data-hc]'), function (b) { return b.dataset.hc; }).filter(function (c) { return c !== 'all'; }); }
  function drift() { /* цвет задаёт только раздел физики, темы его не сдвигают */ }
  window.fxSection = function (id) { base = BASE[id] || 162; off = 0; paint(250); };
  var io = null;
  function watch() {
    if (!('IntersectionObserver' in window)) return;
    if (io) io.disconnect();
    io = new IntersectionObserver(function (es) {
      var hit = null; es.forEach(function (e) { if (e.isIntersecting) hit = e.target; });
      if (hit && hit.dataset.c) drift(hit.dataset.c);
    }, { rootMargin: '-20% 0px -75% 0px' });
    document.querySelectorAll('#hb-list article').forEach(function (a) { io.observe(a); });
  }
  var list = document.getElementById('hb-list'), chips = document.getElementById('hb-chips');
  if (list) new MutationObserver(watch).observe(list, { childList: true });
  if (chips) chips.addEventListener('click', function (e) { var b = e.target.closest('[data-hc]'); if (b && b.dataset.hc !== 'all') drift(b.dataset.hc); });
  watch();

  /* рейка на ПК */
  var mq = window.matchMedia('(min-width:1100px)'), rail = null, items = null;
  function build() {
    rail = document.createElement('aside'); rail.id = 'rail'; rail.setAttribute('aria-label', 'Навигация');
    function grp(cls, title) {
      var g = document.createElement('div'); g.className = 'rail-g ' + cls;
      if (title) { var h = document.createElement('div'); h.className = 'rail-h'; h.textContent = title; g.appendChild(h); }
      rail.appendChild(g); return g;
    }
    var g1 = grp('', ''), g2 = grp('rail-hb', 'Разделы'), g3 = grp('rail-hb', 'Темы');
    items = [[document.getElementById('tabs'), g1], [document.querySelector('.hb-stick'), g2], [chips, g3]];
    items.forEach(function (it) { it.push(document.createComment('rail')); it[0].parentNode.insertBefore(it[2], it[0]); });
    B.insertBefore(rail, document.querySelector('header.hd'));
  }
  function sync() {
    if (mq.matches) { if (!rail) build(); items.forEach(function (it) { it[1].appendChild(it[0]); }); }
    else if (items) items.forEach(function (it) { it[2].parentNode.insertBefore(it[0], it[2]); });
  }
  if (mq.addEventListener) mq.addEventListener('change', sync); else if (mq.addListener) mq.addListener(sync);
  sync();
  var hb = document.getElementById('tab-handbook');
  function flag() { B.classList.toggle('on-hb', !hb.classList.contains('hidden')); }
  if (hb) { new MutationObserver(flag).observe(hb, { attributes: true, attributeFilter: ['class'] }); flag(); }
})();
</script>
